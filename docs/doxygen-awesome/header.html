<script type="text/javascript">

/* Doxygen 1.17 no longer ships jQuery. Initialize the Awesome extensions
   with native DOM APIs so the theme remains fully functional. */
document.addEventListener("DOMContentLoaded", function () {
  var embedded = document.documentElement.classList.contains("dbx-doc-embedded");
  if (embedded) {
    document.body.classList.add("dbx-doc-embedded-body");
  }

  var searchBox = document.getElementById("MSearchBox");
  if (searchBox && !document.querySelector("doxygen-awesome-dark-mode-toggle")) {
    var darkModeToggle = document.createElement("doxygen-awesome-dark-mode-toggle");
    darkModeToggle.title = DoxygenAwesomeDarkModeToggle.title;
    darkModeToggle.updateIcon();
    searchBox.parentNode.appendChild(darkModeToggle);
  }

  if (navigator.clipboard) {
    document.querySelectorAll(".fragment:not(.doxygen-awesome-ready)").forEach(function (fragment) {
      var wrapper = document.createElement("div");
      var copyButton = document.createElement("doxygen-awesome-fragment-copy-button");
      wrapper.className = "doxygen-awesome-fragment-wrapper";
      copyButton.innerHTML = DoxygenAwesomeFragmentCopyButton.copyIcon;
      copyButton.title = DoxygenAwesomeFragmentCopyButton.title;
      fragment.classList.add("doxygen-awesome-ready");
      fragment.parentNode.replaceChild(wrapper, fragment);
      wrapper.appendChild(fragment);
      wrapper.appendChild(copyButton);
    });
  }

  document.querySelectorAll(".contents a.anchor[id], .contents .groupheader > a[id]").forEach(function (node) {
    if (node.parentElement.querySelector(":scope > .anchorlink")) return;
    var anchorLink = document.createElement("a");
    anchorLink.href = "#" + node.id;
    anchorLink.title = DoxygenAwesomeParagraphLink.title;
    anchorLink.className = "anchorlink";
    anchorLink.innerHTML = DoxygenAwesomeParagraphLink.icon;
    node.classList.add("anchor");
    node.parentElement.appendChild(anchorLink);
  });

  var pageName = window.location.pathname.split("/").pop() || "index.html";
  var section = "developer";
  if (pageName === "" || pageName === "index.html") {
    section = "home";
  } else if (pageName === "dbxapp_ki_areas.html"
    || pageName.indexOf("dbxapp_user_ki_") === 0) {
    section = "ki";
  } else if (pageName.indexOf("dbxapp_user_") === 0
    || pageName.indexOf("dbxcontent_tutorial_") === 0) {
    section = "user";
  }
  document.body.setAttribute("data-dbx-doc-section", section);
  var activeLink = document.querySelector(
    '#dbx-doc-audience [data-dbx-section="' + section + '"]'
  );
  if (activeLink) {
    activeLink.classList.add("is-active");
    activeLink.setAttribute("aria-current", "page");
  }

  var audienceNav = document.getElementById("dbx-doc-audience");
  var searchField = document.getElementById("MSearchField");
  var themeToggle = document.querySelector("doxygen-awesome-dark-mode-toggle");
  if (audienceNav) {
    if (embedded) {
      audienceNav.setAttribute("aria-label", "Doxygen-Navigation innerhalb des dbxDocs-Portals");
    }
    var tools = document.createElement("div");
    tools.className = "dbx-doc-tools";
    tools.setAttribute("aria-label", "Dokumentation durchsuchen und Darstellung wählen");
    if (searchBox) {
      tools.appendChild(searchBox);
    }
    if (themeToggle) {
      tools.appendChild(themeToggle);
    }
    if (tools.childNodes.length) {
      audienceNav.appendChild(tools);
    }
  }
  if (searchField) {
    searchField.setAttribute("placeholder", "Dokumentation durchsuchen");
    searchField.setAttribute("aria-label", "Dokumentation durchsuchen");
  }
});
