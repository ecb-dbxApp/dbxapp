<svg xmlns="http://www.w3.org/2000/svg" width="980" height="255" viewBox="0 0 980 255" role="img" aria-labelledby="title desc">
  <title id="title">dbxReport Ausgabearten</title>
  <desc id="desc">Symbolischer Ablauf von Daten ueber dbxReport zu Table, Template und Tabulurator.</desc>
  <defs>
    <style>
      .data{fill:#effaf9;stroke:#0f9f9a;stroke-width:2;rx:8}
      .core{fill:#edf5ff;stroke:#2165b6;stroke-width:2;rx:8}
      .out{fill:#fff;stroke:#7b5bb7;stroke-width:2;rx:8}
      .text{font:600 15px Arial,sans-serif;fill:#172033}
      .small{font:12px Arial,sans-serif;fill:#4b5563}
      .arrow{stroke:#58677a;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58677a"/>
    </marker>
  </defs>
  <rect class="data" x="35" y="82" width="160" height="80"/>
  <text class="text" x="115" y="113" text-anchor="middle">Daten</text>
  <text class="small" x="115" y="136" text-anchor="middle">dbxDB/select()</text>
  <path class="arrow" d="M195 122H280"/>
  <rect class="core" x="280" y="82" width="170" height="80"/>
  <text class="text" x="365" y="113" text-anchor="middle">dbxReport</text>
  <text class="small" x="365" y="136" text-anchor="middle">Filter, Sortierung, Callbacks</text>
  <path class="arrow" d="M450 122H520"/>
  <rect class="out" x="520" y="25" width="160" height="58"/>
  <text class="text" x="600" y="58" text-anchor="middle">table mode</text>
  <rect class="out" x="520" y="96" width="160" height="58"/>
  <text class="text" x="600" y="129" text-anchor="middle">tpl mode</text>
  <rect class="out" x="520" y="167" width="160" height="58"/>
  <text class="text" x="600" y="200" text-anchor="middle">tabulurator</text>
  <path class="arrow" d="M680 54H760"/>
  <path class="arrow" d="M680 125H760"/>
  <path class="arrow" d="M680 196H760"/>
  <rect class="core" x="760" y="82" width="180" height="80"/>
  <text class="text" x="850" y="113" text-anchor="middle">UI</text>
  <text class="small" x="850" y="136" text-anchor="middle">HTML, Ajax, Grid</text>
</svg>
