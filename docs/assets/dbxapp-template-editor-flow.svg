<svg xmlns="http://www.w3.org/2000/svg" width="980" height="250" viewBox="0 0 980 250" role="img" aria-labelledby="title desc">
  <title id="title">Template Editor Flow</title>
  <desc id="desc">Symbolischer Ablauf: Der Editor liest die Datei roh, schuetzt den Quelltext und verhindert Interpretation von Modulmarkern im Editor.</desc>
  <defs>
    <style>
      .file{fill:#fff;stroke:#0f9f9a;stroke-width:2;rx:8}
      .safe{fill:#fff8eb;stroke:#c9841b;stroke-width:2;rx:8}
      .editor{fill:#edf5ff;stroke:#2165b6;stroke-width:2;rx:8}
      .text{font:600 15px Arial,sans-serif;fill:#172033}
      .small{font:12px Arial,sans-serif;fill:#4b5563}
      .arrow{stroke:#58677a;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58677a"/>
    </marker>
  </defs>
  <rect class="file" x="25" y="75" width="180" height="80"/>
  <text class="text" x="115" y="104" text-anchor="middle">/tpl/*.htm</text>
  <text class="small" x="115" y="127" text-anchor="middle">Rohtext mit [modul]</text>
  <path class="arrow" d="M205 115H265"/>
  <rect class="safe" x="265" y="75" width="180" height="80"/>
  <text class="text" x="355" y="104" text-anchor="middle">norep()</text>
  <text class="small" x="355" y="127" text-anchor="middle">Quelltext schuetzen</text>
  <path class="arrow" d="M445 115H505"/>
  <rect class="editor" x="505" y="75" width="190" height="80"/>
  <text class="text" x="600" y="104" text-anchor="middle">dbxEditor</text>
  <text class="small" x="600" y="127" text-anchor="middle">Ace/Textarea editiert Datei</text>
  <path class="arrow" d="M695 115H755"/>
  <rect class="safe" x="755" y="75" width="190" height="80"/>
  <text class="text" x="850" y="104" text-anchor="middle">Interpreter</text>
  <text class="small" x="850" y="127" text-anchor="middle">ueberspringt Editor-Quelle</text>
  <text class="small" x="490" y="205" text-anchor="middle">Wichtig: Nur die Webseite rendert Modulmarker. Der Editor bearbeitet immer die Datei, nie das gerenderte DOM.</text>
</svg>
