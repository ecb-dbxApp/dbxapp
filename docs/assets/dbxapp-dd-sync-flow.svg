<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-labelledby="title desc">
  <title id="title">DD und DB Synchronisation</title>
  <desc id="desc">Symbolischer Ablauf zwischen DataDictionary, Sync-Plan, Datenbank, Backup und Restore.</desc>
  <defs>
    <style>
      .dd{fill:#effaf9;stroke:#0f9f9a;stroke-width:2;rx:8}
      .db{fill:#edf5ff;stroke:#2165b6;stroke-width:2;rx:8}
      .bak{fill:#fff8eb;stroke:#c9841b;stroke-width:2;rx:8}
      .text{font:600 15px Arial,sans-serif;fill:#172033}
      .small{font:12px Arial,sans-serif;fill:#4b5563}
      .arrow{stroke:#58677a;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58677a"/>
    </marker>
  </defs>
  <rect class="dd" x="35" y="45" width="180" height="80"/>
  <text class="text" x="125" y="76" text-anchor="middle">DD-Datei</text>
  <text class="small" x="125" y="99" text-anchor="middle">table, fields, indexes</text>
  <path class="arrow" d="M215 85H300"/>
  <rect class="db" x="300" y="45" width="180" height="80"/>
  <text class="text" x="390" y="76" text-anchor="middle">Sync-Plan</text>
  <text class="small" x="390" y="99" text-anchor="middle">check, plan, apply</text>
  <path class="arrow" d="M480 85H565"/>
  <rect class="db" x="565" y="45" width="180" height="80"/>
  <text class="text" x="655" y="76" text-anchor="middle">DB-Struktur</text>
  <text class="small" x="655" y="99" text-anchor="middle">create/add/rebuild</text>
  <path class="arrow" d="M655 125V170"/>
  <rect class="bak" x="565" y="170" width="180" height="80"/>
  <text class="text" x="655" y="201" text-anchor="middle">Backup/Restore</text>
  <text class="small" x="655" y="224" text-anchor="middle">bei Rebuild/Transfer</text>
  <path class="arrow" d="M565 210H480"/>
  <rect class="dd" x="300" y="170" width="180" height="80"/>
  <text class="text" x="390" y="201" text-anchor="middle">DB -> DD</text>
  <text class="small" x="390" y="224" text-anchor="middle">merge vorhandener Werte</text>
  <path class="arrow" d="M300 210H215"/>
  <text class="small" x="125" y="214" text-anchor="middle">DD bleibt</text>
  <text class="small" x="125" y="232" text-anchor="middle">fachliche Quelle</text>
</svg>
