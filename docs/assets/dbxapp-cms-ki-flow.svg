<svg xmlns="http://www.w3.org/2000/svg" width="980" height="315" viewBox="0 0 980 315" role="img" aria-labelledby="title desc">
  <title id="title">CMS und dbxKi Ablauf</title>
  <desc id="desc">Symbolischer Ablauf vom CMS-Editor ueber Content-Daten, Medien, Renderer, Cache und dbxKi Preview/Execute.</desc>
  <defs>
    <style>
      .cms{fill:#effaf9;stroke:#0f9f9a;stroke-width:2;rx:8}
      .ki{fill:#fcfbff;stroke:#7b5bb7;stroke-width:2;rx:8}
      .core{fill:#edf5ff;stroke:#2165b6;stroke-width:2;rx:8}
      .cache{fill:#fff8eb;stroke:#c9841b;stroke-width:2;rx:8}
      .text{font:600 15px Arial,sans-serif;fill:#172033}
      .small{font:12px Arial,sans-serif;fill:#4b5563}
      .arrow{stroke:#58677a;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58677a"/>
    </marker>
  </defs>
  <rect class="cms" x="30" y="45" width="165" height="75"/>
  <text class="text" x="112" y="75" text-anchor="middle">CMS Admin</text>
  <text class="small" x="112" y="98" text-anchor="middle">Tree, Seite, Medien</text>
  <path class="arrow" d="M195 82H250"/>
  <rect class="core" x="250" y="45" width="170" height="75"/>
  <text class="text" x="335" y="75" text-anchor="middle">Content-DDs</text>
  <text class="small" x="335" y="98" text-anchor="middle">content_lng, folder</text>
  <path class="arrow" d="M420 82H475"/>
  <rect class="core" x="475" y="45" width="170" height="75"/>
  <text class="text" x="560" y="75" text-anchor="middle">Renderer</text>
  <text class="small" x="560" y="98" text-anchor="middle">Template + Module</text>
  <path class="arrow" d="M645 82H700"/>
  <rect class="cache" x="700" y="45" width="220" height="75"/>
  <text class="text" x="810" y="75" text-anchor="middle">Permalink/Cache</text>
  <text class="small" x="810" y="98" text-anchor="middle">Meta, Home, Sitemap</text>
  <rect class="ki" x="250" y="190" width="170" height="75"/>
  <text class="text" x="335" y="220" text-anchor="middle">dbxKi</text>
  <text class="small" x="335" y="243" text-anchor="middle">describe, preview, execute</text>
  <path class="arrow" d="M335 190V120"/>
  <path class="arrow" d="M420 228H475"/>
  <rect class="cms" x="475" y="190" width="170" height="75"/>
  <text class="text" x="560" y="220" text-anchor="middle">Aktionen</text>
  <text class="small" x="560" y="243" text-anchor="middle">create/update/translate</text>
  <path class="arrow" d="M560 190V120"/>
  <text class="small" x="490" y="292" text-anchor="middle">dbxKi schreibt nicht direkt SQL, sondern benutzt die CMS-Aktionen mit Preview, Plan-ID, Token und Cache-Invalidierung.</text>
</svg>
