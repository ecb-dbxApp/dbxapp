<h4>Grupo de usuarios</h4>
<p>Crear roles y grupos de permisos o editar entradas existentes.</p>
<ul>
<li><strong>Almacenamiento</strong> Toma nombre, descripción y estado activo.</li>
<li><strong>Recargar</strong> Rechaza cambios no registrados.</li>
<li><strong>Eliminación</strong> elimina la final del grupo (sólo para los conjuntos de datos existentes).</li>
</ul>
