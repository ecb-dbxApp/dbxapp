<h4>User group</h4>
<p>Create roles and permission groups or edit existing entries.</p>
<ul>
<li><strong>Storage</strong> Takes over name, description and active status.</li>
<li><strong>Reload</strong> Rejects unrecorded changes.</li>
<li><strong>Deletion</strong> removes the group final (only for existing datasets).</li>
</ul>
