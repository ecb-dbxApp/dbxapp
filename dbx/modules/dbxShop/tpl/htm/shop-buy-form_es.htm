<form action="{action}" method="post" id="dbx_shop_buy_{buy_form_id}" class="dbx-shop-buy-form">
   <div class="dbx-shop-buy-form-grid">
      {obj:qty}
      <div class="dbx-shop-detail-actions">
         <a class="btn btn-outline-secondary" href="{catalog_url}"><i class="bi bi-arrow-left"></i> Volver al catálogo</a>

      </div>
   </div>
   [dbx:form]
</form>
