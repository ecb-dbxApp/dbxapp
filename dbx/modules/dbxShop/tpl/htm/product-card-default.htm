<article class="dbx-shop-product-card dbx-shop-product-card-default {card_class}">
   <a class="dbx-shop-product-visual-link" href="{detail_url}" aria-label="{title} ansehen">{visual}</a>
   <div class="dbx-shop-product-body">
      <div class="dbx-shop-chip-row">{groups}</div>
      <h3>{title}</h3>
      <p>{summary}</p>
      {attributes}
   </div>
   <div class="dbx-shop-product-footer">
      <div class="dbx-shop-card-price"><strong>{price}</strong>{tax_shipping}</div>
      <a class="btn btn-primary btn-sm dbx-shop-card-action" href="{detail_url}"><i class="bi bi-eye"></i> Ansehen</a>
   </div>
</article>
