<article class="dbx-shop-card {card_class}">
   <a class="dbx-shop-card-visual" href="{detail_url}">
      {visual}
   </a>
   <div class="dbx-shop-card-body">
      <div class="dbx-shop-chips">{groups}</div>
      <h3>{title}</h3>
      <p>{summary}</p>
      {attributes}
      <strong class="dbx-shop-price">{price}</strong>
      {tax_shipping}
      <a class="btn btn-primary btn-sm dbx-shop-card-action" href="{detail_url}"><i class="bi bi-eye"></i> Ver</a>
   </div>
</article>
