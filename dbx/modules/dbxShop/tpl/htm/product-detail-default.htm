<section class="dbx-shop-product-detail dbx-shop-product-detail-default {detail_class}">
   {gallery}
   <div class="dbx-shop-detail-panel">
      <p class="dbx-shop-sku">{sku}</p>
      <h3>{title}</h3>
      <div class="dbx-shop-chip-row">{groups}{channels}</div>
      <p class="dbx-shop-detail-description">{description}</p>
      {attributes}
      <div class="dbx-shop-detail-price"><strong>{price}</strong>{tax_shipping}</div>
      {shipping_info}
      {stock_info}
      {buy_form}
   </div>
</section>
