[tpl=dbx|report-shell-head]
   {shop_admin_style}
   {product_tree_panel}
   [dbx:pagination]
   <div class="table-responsive">
    <table class="table table-striped table-bordered table-light table-hover align-middle dbx-shop-products-report">
     <thead>
      <tr class="{tr-class}">[rpt:row]</tr>
     </thead>
     <tbody>
      <hr class="dbx_split">
      <tr class="{tr-class}">[rpt:row]</tr>
      <hr class="dbx_split">
     </tbody>
     <tfoot>
      <tr>
       <td colspan="{rpt:col_count}">
        <div class="dbx-bar dbx-report-footer dbx-shop-products-actions">
         {report_products_actions}
        </div>
       </td>
      </tr>
     </tfoot>
    </table>
   </div>
[tpl=dbx|report-shell-foot]
