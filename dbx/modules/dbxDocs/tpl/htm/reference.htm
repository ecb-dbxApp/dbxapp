<section class="dbxdocs-reference" aria-labelledby="dbxdocs-reference-title">
    <header class="dbxdocs-reference-header">
        <div>
            <span class="dbxdocs-reference-kicker"><i class="bi bi-code-square" aria-hidden="true"></i> Doxygen</span>
            <h1 id="dbxdocs-reference-title">{reference_title}</h1>
            <p>{reference_subtitle}</p>
        </div>
        <div class="dbxdocs-reference-actions" aria-label="{reference_actions_label}">
            <button
                type="button"
                class="btn btn-outline-primary dbx-win"
                data-url="{reference_window_url}"
                data-title="{reference_title}"
                data-width="1500"
                data-height="920"
            >
                <i class="bi bi-window" aria-hidden="true"></i>
                <span>{reference_window_label}</span>
            </button>
            <a class="btn btn-primary" href="{reference_tab_url}" target="_blank" rel="noopener">
                <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>
                <span>{reference_tab_label}</span>
            </a>
        </div>
    </header>
    <iframe
        class="dbxdocs-reference-frame"
        src="{reference_url}"
        title="{reference_title}"
        loading="eager"
        referrerpolicy="same-origin"
        sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox"
    >
        <p>{reference_fallback} <a href="{reference_tab_url}">{reference_tab_label}</a></p>
    </iframe>
</section>
