
<div id="dbxForm_{i}" class="dbx-panel dbxForm_wrapper dbx-user-auth dbx-user-login">
  <form action="?dbx_modul=dbxLogin&dbx_run1=login" class="dbxAjax" method="post" id="form_login" data-target="dbxForm_{i}">
    <div class="dbx-auth-shell">
      <section class="dbx-auth-panel dbx-auth-panel-main">
        <div class="dbx-auth-panel-head">
          <span class="dbx-auth-brand-icon"><i class="bi bi-shield-lock"></i></span>
          <span class="dbx-auth-panel-title">
            <strong>Login / Anmelden</strong>
          </span>
          <span class="dbx-auth-panel-actions">{bar_extra}</span>
        </div>

        <div class="dbx-auth-message">{form:message}</div>

        <div class="Qd-none">[dbx:form]</div>

        <div class="dbx-auth-fields">
          {obj:username}
          {obj:password}
          <button type="submit" class="btn btn-primary dbx-auth-submit">
            <i class="bi bi-box-arrow-in-right"></i>
            <span>Login / Anmelden</span>
          </button>
        </div>

        {obj:register_link}
        <div class="dbx-auth-alt-link"><a href="?dbx_modul=dbxLogin&amp;dbx_run1=password_reset"><i class="bi bi-key"></i> Passwort vergessen?</a></div>
      </section>

      <aside class="dbx-auth-panel dbx-auth-panel-side">
        <div class="dbx-auth-side-brandrow">
          <div class="dbx-auth-side-icon"><i class="bi bi-stars"></i></div>
          <div class="dbx-auth-side-wordmark" role="img" aria-label="dbXapp">
            <span aria-hidden="true">db</span><strong aria-hidden="true">X</strong><span aria-hidden="true">app</span>
          </div>
        </div>
        <h3>Ein Zugang fuer Inhalte, Module und Verwaltung</h3>
        <ul class="dbx-auth-feature-list">
          <li><i class="bi bi-check2-circle"></i><span>Persönliche Arbeitsumgebung</span></li>
          <li><i class="bi bi-window-stack"></i><span>Zugriff auf Module und Daten</span></li>
          <li><i class="bi bi-envelope-check"></i><span>Zugriff auf alle eigenen Daten</span></li>
        </ul>
      </aside>
    </div>
    [dbx:js]
  </form>
</div>
