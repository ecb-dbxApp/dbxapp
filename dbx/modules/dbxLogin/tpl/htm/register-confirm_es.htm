<div class="dbx-register-confirm" data-dbx="lib=form">
  <section class="dbx-auth-panel dbx-register-confirm-card dbx-register-confirm-{status}">
    <div class="dbx-auth-panel-head">
      <span class="dbx-auth-brand-icon"><i class="bi {icon}"></i></span>
      <span class="dbx-auth-panel-title">
        <small>{kicker}</small>
        <strong>{title}</strong>
      </span>
    </div>

    <div class="dbx-register-confirm-body">
      <p class="dbx-register-confirm-lead">{message}</p>
      <div class="dbx-register-confirm-panel">
        <i class="bi {detail_icon}"></i>
        <span>{detail}</span>
      </div>
      <a class="btn btn-primary dbx-register-confirm-action" href="?dbx_modul=dbxLogin&dbx_run1=login">
        <i class="bi bi-box-arrow-in-right"></i>
        <span>Para iniciar sesión</span>
      </a>
    </div>
  </section>
</div>
