<div id="dbxForm_{i}" class="dbx-panel dbxForm_wrapper dbx-user-auth dbx-user-login">
  <form action="{action}" class="dbxAjax" method="post" id="form_password_reset_request" data-target="dbxForm_{i}" autocomplete="off">
    <div class="dbx-auth-shell">
      <section class="dbx-auth-panel dbx-auth-panel-main">
        <div class="dbx-auth-panel-head">
          <span class="dbx-auth-brand-icon"><i class="bi bi-key"></i></span>
          <span class="dbx-auth-panel-title"><small>Kontozugang</small><strong>Passwort vergessen</strong></span>
          <span class="dbx-auth-panel-actions">{bar_extra}</span>
        </div>
        <div class="dbx-auth-message">{obj:form_msg}</div>
        <div class="Qd-none">[dbx:form]</div>
        <div class="dbx-auth-fields">
          {obj:identity}
          <button type="submit" class="btn btn-primary dbx-auth-submit"><i class="bi bi-send"></i><span>Sicheren Link anfordern</span></button>
        </div>
        <div class="dbx-auth-alt-link"><a href="?dbx_modul=dbxLogin&amp;dbx_run1=login"><i class="bi bi-arrow-left"></i> Zur Anmeldung</a></div>
      </section>
      <aside class="dbx-auth-panel dbx-auth-panel-side">
        <div class="dbx-auth-side-brandrow"><div class="dbx-auth-side-icon"><i class="bi bi-shield-check"></i></div><div class="dbx-auth-side-wordmark" role="img" aria-label="dbxapp"><span>db</span><strong>X</strong><span>app</span></div></div>
        <h3>Ohne Auskunft über Konten</h3>
        <ul class="dbx-auth-feature-list">
          <li><i class="bi bi-incognito"></i><span>Die Antwort verrät nicht, ob ein Konto existiert.</span></li>
          <li><i class="bi bi-clock-history"></i><span>Der Einmal-Link ist nur 60 Minuten gültig.</span></li>
          <li><i class="bi bi-door-closed"></i><span>Nach dem Reset werden alte Sitzungen beendet.</span></li>
        </ul>
      </aside>
    </div>
    [dbx:js]
  </form>
</div>
