<!doctype html>
<html lang="en"><body style="font-family:Arial,sans-serif;color:#15324f;line-height:1.55">
  <h1 style="font-size:22px">Reset your password</h1>
  <p>Hello {name},</p>
  <p>A new password was requested for your dbxapp account.</p>
  <p><a href="{reset_url}" style="display:inline-block;padding:12px 18px;background:#0868d7;color:#fff;text-decoration:none;border-radius:6px">Set a new password</a></p>
  <p>The link is valid for {valid_minutes} minutes and can only be used once.</p>
  <p>Ignore this email if you did not make the request. Your existing password remains unchanged.</p>
</body></html>
