<div id="dbx_target_{i}" class="dbx-panel dbxForm_wrapper dbx-avatar-compact">
 <div id="dbx_avatar_panel_{i}" class="dbx-avatar-form" data-target="dbx_target_{i}">
  <div class="dbx-avatar-shell">
   <div>{obj:form_msg}</div>
   <div class="dbx-avatar-head">
    <div class="dbx-avatar-preview">{obj:avatar_preview}</div>
    <div class="dbx-avatar-copy">
     <h4 class="dbx-form-title">Profile picture</h4>
     <div class="dbx-avatar-hint">JPG, PNG, WebP or GIF up to 2 MB.</div>
    </div>
   </div>
   <label id="uploader_{i}" class="dbx-avatar-drop" for="avatar_file_{i}" role="button" tabindex="0" data-dbx_get="{action}" data-dbx_target="dbx_target_{i}">
    <i class="bi bi-cloud-arrow-up" aria-hidden="true"></i>
    <div>
     <div class="dbx-avatar-drop-title">File or file</div>
     <div class="dbx-avatar-drop-meta">Square, is automatically cut.</div>
    </div>
   </label>
   <input id="avatar_file_{i}" class="visually-hidden dbx-avatar-file-input" type="file" name="upload_file" accept="image/jpeg,image/png,image/webp,image/gif">
   <div class="dbx-avatar-actions">
    <button type="submit" class="btn btn-primary btn-sm w-100">
     <i class="bi bi-save me-1"></i>Save profile
    </button>
   </div>
  </div>
  [dbx:js]
 </div>
</div>
