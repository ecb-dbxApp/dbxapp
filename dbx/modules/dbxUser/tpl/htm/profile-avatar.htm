<div class="border rounded p-3 bg-light h-100">
  <h5 class="mb-3">Avatar</h5>
  <div class="text-center mb-3">
    <img src="{src}" alt="Avatar" class="img-fluid rounded-circle border bg-white" style="width: 180px; height: 180px; object-fit: cover;">
  </div>
  <a class="btn btn-outline-primary w-100 dbx-win"
     href="{upload_url}"
     data-url="{upload_url}" data-title="Avatar hochladen" data-height="500" data-width="600">
     Avatar hochladen
  </a>
</div>
