<div id="dbx_target_{i}" class="dbx-panel dbxForm_wrapper dbx-admin-update">
 <form action="{action}" method="post" class="dbxAjax" data-target="dbx_target_{i}" id="dbxForm_{i}">
  [tpl=dbx|module-bar]
  <style>
  .dbx-admin-update .dbx-update-body{padding:1rem}.dbx-admin-update .dbx-update-intro{max-width:920px;color:var(--dbx-text-muted,#64748b)}
  .dbx-admin-update .dbx-update-status{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:.75rem;margin:1rem 0}.dbx-admin-update .dbx-update-metric{padding:1rem;border:1px solid rgba(100,116,139,.22);border-radius:.85rem;background:var(--dbx-bg-panel,#fff);box-shadow:0 8px 22px rgba(15,23,42,.06)}.dbx-admin-update .dbx-update-metric span{display:block;font-size:.75rem;color:var(--dbx-text-muted,#64748b);text-transform:uppercase;letter-spacing:.04em}.dbx-admin-update .dbx-update-metric strong{display:block;margin-top:.25rem;font-size:1.08rem;overflow-wrap:anywhere}
  .dbx-admin-update .dbx-update-state{padding:.8rem 1rem;border-radius:.75rem;background:rgba(34,197,94,.1);color:#166534;font-weight:700}.dbx-admin-update .dbx-update-state.is-update{background:rgba(245,158,11,.14);color:#92400e}.dbx-admin-update .dbx-update-actions{display:flex;flex-wrap:wrap;gap:.65rem;margin:1rem 0}.dbx-admin-update .dbx-update-notes{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}.dbx-admin-update .dbx-update-note{padding:1rem;border:1px solid rgba(100,116,139,.2);border-radius:.85rem;background:color-mix(in srgb,var(--dbx-bg-panel,#fff) 94%,var(--dbx-primary,#2563eb))}.dbx-admin-update .dbx-update-note h3{font-size:1rem;margin:0 0 .45rem}.dbx-admin-update .dbx-update-note p{margin:0;color:var(--dbx-text-muted,#64748b)}@media(max-width:900px){.dbx-admin-update .dbx-update-status{grid-template-columns:1fr 1fr}}@media(max-width:560px){.dbx-admin-update .dbx-update-status,.dbx-admin-update .dbx-update-notes{grid-template-columns:1fr}}
  </style>
  <div class="dbx-update-body"><div class="form_msg {msg_class} mb-3">{obj:form_msg}</div><p class="dbx-update-intro">{intro}</p><div class="dbx-update-status"><div class="dbx-update-metric"><span>{current_label}</span><strong>{current_version}</strong></div><div class="dbx-update-metric"><span>{available_label}</span><strong>{available_version}</strong></div><div class="dbx-update-metric"><span>{staged_label}</span><strong>{staged_version}</strong></div><div class="dbx-update-metric"><span>{checked_label}</span><strong>{checked_at}</strong></div></div><div class="dbx-update-state {status_class}"><i class="bi bi-shield-check"></i> {status_text}</div><div class="dbx-update-actions"><button class="btn btn-outline-primary" type="submit" name="update_operation" value="check"><i class="bi bi-cloud-arrow-down"></i> {check_label}</button><button class="btn btn-outline-primary" type="submit" name="update_operation" value="stage" {stage_disabled}><i class="bi bi-box-seam"></i> {stage_label}</button><button class="btn btn-primary dbxConfirm" type="submit" name="update_operation" value="install" {install_disabled} data-confirm-title="{install_confirm_title}" data-confirm="{install_confirm}" data-confirm-hint="<small>{install_confirm_hint}</small>" data-confirm-buttons="yesno"><i class="bi bi-arrow-repeat"></i> {install_label}</button><button class="btn btn-outline-danger dbxConfirm" type="submit" name="update_operation" value="rollback" {rollback_disabled} data-confirm-title="{rollback_confirm_title}" data-confirm="{rollback_confirm}" data-confirm-hint="<small>{rollback_confirm_hint}</small>" data-confirm-buttons="yesno"><i class="bi bi-arrow-counterclockwise"></i> {rollback_label}</button></div><div class="dbx-update-notes"><article class="dbx-update-note"><h3><i class="bi bi-shield-lock"></i> {security_title}</h3><p>{security_text}</p></article><article class="dbx-update-note"><h3><i class="bi bi-database-check"></i> {database_title}</h3><p>{database_text}</p></article></div>[dbx:form]</div>
 </form>
</div>
