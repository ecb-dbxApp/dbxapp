<article class="dbx-panel dbx-admin-dashboard-widget dbx-admin-dashboard-widget-{tone}" data-admin-widget="1">
   <div class="dbx-admin-dashboard-widget-body">
      <div class="dbx-admin-dashboard-widget-head">
         <i class="bi {icon}"></i>
         <span>{label}</span>
      </div>
      <div class="dbx-admin-dashboard-widget-copy">
         <strong data-admin-value="{raw}">{value}</strong>
         <small>{note}</small>
      </div>
      <em>{trend}</em>
      <canvas width="150" height="52" data-admin-spark="{spark}" aria-hidden="true"></canvas>
   </div>
</article>
