<h4>Purpose</h4>
<p>DD Editor maintains table metadata and field definitions in <code>dd/*.dd.php</code>.</p>
<h4>Procedure</h4>
<ol>
<li>Open table + fields in the editor.</li>
<li>Field type, rules, index adjustment.</li>
<li>Save order by drag.</li>
<li>Then execute DD Sync.</li>
</ol>
<div class="help-flow">DD Editor → Add field → Save → DD Sync Apply</div>
