<article class="dbx-admin-dashboard-performance-module">
   <div class="dbx-admin-dashboard-performance-module-media">
      <div class="dbx-admin-dashboard-performance-module-head">
         <i class="bi bi-box-seam"></i>
         <span>Modul</span>
      </div>
      <img src="{module_img}" alt="{module_name}">
      <div>
         <strong>{module_name}</strong>
         <small>{request_count} Requests</small>
      </div>
   </div>
   <div class="dbx-admin-dashboard-performance-module-metrics">
      {metrics}
   </div>
</article>
