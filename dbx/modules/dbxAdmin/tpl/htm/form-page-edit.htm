<div id="dbx_target_{i}" class="dbx-panel dbxForm_wrapper">
  <form action="{action}" method="post" id="dbx_form_{i}"  class="dbxAjax {class}" enctype="multipart/form-data">
    <div class="row"><div class="col">{obj:form_msg}</div></div>
    [dbx:form]
    <div class="row">
      <div class="col-md-4 mb-3">
          {obj:design}
      </div>
      <div class="col-md-4 mb-3">
          {obj:lng}
      </div>
      <div class="col-md-4 mb-3">
          {obj:file}
      </div>
    </div>
    <div class="row">
      <div class="col">{obj:tpl}</col>
    </div>
    <div class="row">
       <div class="col"><br><hr><br></col>
    </div>
    <div class="row">
       <div class="col">{obj:button_save}</div>
    </div>
  </form>
  [dbx:js]
</div>
