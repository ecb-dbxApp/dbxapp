<section class="dbx-admin-dashboard-update dbx-admin-dashboard-update-{state_class}" aria-label="{update_title}">
   <div class="dbx-admin-dashboard-update-icon" aria-hidden="true">
      <i class="bi {state_icon}"></i>
   </div>
   <div class="dbx-admin-dashboard-update-copy">
      <strong>{status_text}</strong>
      <span>{version_text}</span>
      <small>{checked_text}</small>
   </div>
   <a class="btn {action_class}" href="?dbx_modul=dbxAdmin&amp;dbx_run1=update&amp;dbx_page=admin">
      <i class="bi bi-arrow-repeat" aria-hidden="true"></i>
      {action_label}
   </a>
</section>
