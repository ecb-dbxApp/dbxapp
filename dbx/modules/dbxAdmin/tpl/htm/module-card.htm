<article class="dbx-module-row {tr-class}{card_state_class}">
 <div class="dbx-cms-settings-panel dbx-module-panel-wrap is-open" data-module-ui-state="{xmodul}">
  <div class="dbx-bar dbx-module-bar dbx-module-panel-head">
   <button type="button" class="dbx-module-panel-toggle-btn" aria-expanded="true" title="{toggle_title}">
    <i class="bi bi-chevron-down dbx-cms-toggle-icon dbx-module-toggle-icon" aria-hidden="true"></i>
   </button>
   <div class="dbx-bar-title dbx-module-summary-main">
    {select_html}
    <i class="bi bi-box-seam" aria-hidden="true"></i>
    <span class="dbx-module-row-name">{title}</span>
    <span class="dbx-module-row-badges">
     <span class="badge text-bg-{active_class} dbx-module-status-badge" data-module-status-badge>{active_label}</span>
     <span class="badge text-bg-light border">v{version}</span>
     <span class="badge text-bg-light border">{dd_count} DD</span>
    </span>
   </div>
   <div class="dbx-bar-actions dbx-module-panel-actions">
    {actions_html}
   </div>
  </div>
  <div class="dbx-module-panel-body">
   <div class="dbx-module-row-content">
    <div class="dbx-module-row-images-wrap">
     {graphic_html}
    </div>
    <div class="dbx-module-row-access">
     {access_inline_html}
    </div>
    <div class="dbx-module-row-dd">
     {dd_html}
    </div>
   </div>
  </div>
 </div>
</article>
