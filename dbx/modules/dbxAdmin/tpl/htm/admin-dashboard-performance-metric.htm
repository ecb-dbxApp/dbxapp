<div class="dbx-admin-dashboard-performance-metric dbx-admin-dashboard-performance-metric-{tone}">
   <div class="dbx-admin-dashboard-performance-metric-head">
      <i class="bi {icon}"></i>
      <span>{label}</span>
   </div>
   <canvas width="190" height="126" data-admin-gauge="1" data-admin-gauge-value="{raw}" data-admin-gauge-max="{max}" data-admin-gauge-tone="{tone}" aria-hidden="true"></canvas>
   <div class="dbx-admin-dashboard-performance-metric-value">
      <strong>{value}</strong>
      <small>{detail}</small>
   </div>
</div>
