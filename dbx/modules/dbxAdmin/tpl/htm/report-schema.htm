<div class="dbx-panel dbxReport dbx-ajax-root" id="dbx_target_{i}" data-dbx="lib=report">[tpl=dbx|module-bar]
 <div class="dbx-panel-body">
  <div class="mb-3">{obj:form_msg}</div>
  <form action="{action}" method="post" name="dbx_form_{i}" id="dbx_form_{i}" class="dbxAjax">
   [dbx:form]
   <div class="row g-2 align-items-end mb-3">
    <div class="col-12 col-md-2">{obj:dbx_rmodul}</div>
    <div class="col-12 col-md-3">{obj:dbx_rwhere}</div>
    <div class="col-6 col-md-2">{obj:dbx_rrows}</div>
    <div class="col-6 col-md-auto">
     <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i></button>
    </div>
   </div>
   [dbx:pagination]
   <div class="table-responsive">
    <table class="table table-striped table-bordered table-light table-hover align-middle">
     <thead>
      <tr class="{tr-class}">[rpt:row]</tr>
     </thead>
     <tbody>
      <hr class="dbx_split">
      <tr class="{tr-class}">[rpt:row]</tr>
      <hr class="dbx_split">
     </tbody>
     <tfoot>
      <tr>
       <td colspan="{rpt:col_count}">
        <div class="row g-2 align-items-center">
         <div class="col-12 col-md-4">{obj:maction_select}</div>
         <div class="col-auto">{obj:maction_submit}</div>
        </div>
       </td>
      </tr>
     </tfoot>
    </table>
   </div>
  </form>
 </div>
 [dbx:js]
</div>
