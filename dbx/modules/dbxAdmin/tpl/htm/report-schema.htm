<div class="dbx-panel dbxReport dbx-ajax-root" id="dbx_target_{i}" data-dbx="lib=report">
 <div class="dbx-panel-body">
  <div class="mb-3">{report:message}</div>
  <form action="{action}" method="post" name="dbx_form_{i}" id="dbx_form_{i}" class="dbxAjax">
   {report:bar}
   [dbx:pagination]
   <div class="table-responsive">
    <table class="table table-striped table-bordered table-light table-hover align-middle">
     <thead>
      <tr class="{tr-class}">[rpt:row]</tr>
     </thead>
     <tbody>
      <hr class="dbx_split">
      <tr class="{tr-class}">[rpt:row]</tr>
      <hr class="dbx_split">
     </tbody>
     <tfoot>
      <tr>
       <td colspan="{rpt:col_count}">
        <div class="row g-2 align-items-center">
         <div class="col-12 col-md-4">{obj:maction_select}</div>
         <div class="col-auto">{obj:maction_submit}</div>
        </div>
       </td>
      </tr>
     </tfoot>
    </table>
   </div>
  </form>
 </div>
 {report:footer}
 [dbx:js]
</div>
