<section class="dbx-admin-dashboard-change-log">
 <header class="dbx-admin-dashboard-change-log-head">
  <div class="dbx-admin-dashboard-change-log-title">
   <span class="dbx-admin-dashboard-change-log-icon"><i class="bi bi-journal-richtext"></i></span>
   <div><h2>Change Log</h2><p>Die letzten abgeschlossenen Änderungen auf einen Blick</p></div>
  </div>
  <span class="dbx-admin-dashboard-change-log-count">{count} Einträge</span>
 </header>
 <div class="dbx-admin-dashboard-change-log-stream">{items}</div>
 <footer class="dbx-admin-dashboard-change-log-actions">
  <a class="btn btn-outline-primary" href="{list_url}"><i class="bi bi-funnel"></i> Vollständige Liste &amp; Filter</a>
  <a class="btn btn-primary" href="{new_url}"><i class="bi bi-plus-lg"></i> Eintrag anlegen</a>
 </footer>
</section>
