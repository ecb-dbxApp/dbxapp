<div class="dbx-bar dbx-module-row-bar">
 <div class="dbx-bar-title dbx-module-row-bar-title">
  {select_html}
  <span class="dbx-module-row-icon" aria-hidden="true"><i class="bi bi-box-seam"></i></span>
  <span class="dbx-module-row-name">{title}</span>
  <span class="dbx-module-row-badges">
   <span class="badge text-bg-{active_class}">{active_label}</span>
   <span class="badge text-bg-light border">v{version}</span>
   <span class="badge text-bg-light border">{dd_count} DD</span>
  </span>
 </div>
 <div class="dbx-bar-actions dbx-module-row-bar-actions">
  {actions_html}
 </div>
</div>
