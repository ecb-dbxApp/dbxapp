<div id="dbx_target_{i}" class="dbx-panel dbxForm_wrapper">    
 <form action="{action}" method="post" id="dbx_form_{i}" class="dbxAjax">    
 <div class="row">    
 <div class="col">{obj:form_msg}[dbx:form]</div>    
 </div>    
    
 <div class="row">    
 <div class="col-md-4 mb-3">{obj:name}</div>    
 <div class="col-md-4 mb-3">{obj:type}</div>    
 <div class="col-md-4 mb-3">{obj:length}</div>    
 </div>    
    
 <div class="row">  
 <div class="col-md-4 mb-3">{obj:label}</div>    
 <div class="col-md-4 mb-3">{obj:default}</div>      
 <div class="col-md-4 mb-3">{obj:index}</div>    
 </div>    
    
 <div class="row">    
 <div class="col-md-4 mb-3">{obj:rules}</div>  
 <div class="col-md-4 mb-3">{obj:tooltip}</div>    
 <div class="col-md-4 mb-3">{obj:errormsg}</div>      
 </div>    
    
    
 <div class="row">    
 <div class="col-md-4 mb-3">{obj:mask}</div>    
 <div class="col-md-4 mb-3">{obj:data}</div>    
 <div class="col-md-4 mb-3">{obj:options}</div>  
 </div>    

 <div class="row">    
    <div class="col-md-4 mb-3">{obj:tpl}</div>    
    <div class="col-md-4 mb-3">{obj:js}</div>    
    <div class="col-md-4 mb-3">{obj:placeholder}</div>  

</div>    


<div class="row">    
 <div class="col"><hr/></div>    
 </div>    
 <div class="row">    
 <div class="col"><button class="btn btn-primary btn-lg btn-block" type="submit">DataDictonary Feld speichern</button></div>    
 </div>    
 </form>    
 [dbx:js]    
</div>
