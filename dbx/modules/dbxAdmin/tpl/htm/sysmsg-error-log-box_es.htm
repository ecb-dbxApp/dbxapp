<div class="card mb-3">
 <div class="card-header d-flex align-items-center justify-content-between gap-2">
  <div>
   <strong>Registro de errores de PHP</strong>
   <span class="text-muted ms-2">{file} ({size} Bytes</span>
  </div>
  <a class="btn btn-sm btn-danger dbxAjax dbxConfirm"
     href="{action}" data-dbx-tooltip="Eliminar el registro de error de PHP"
     data-confirm-title="<i class='bi bi-trash'></i> Eliminar el registro de error"
     data-confirm="¿De verdad borrar el registro de error PHP?"
     data-confirm-hint="<small>Esta acción no se puede deshacer.</small>"
     data-confirm-buttons="yesno"
     role="button">
   <i class="bi bi-trash"></i>
   Eliminar el registro
  </a>
 </div>
 <pre class="card-body mb-0 bg-light border-top" style="max-height: 280px; overflow: auto; resize: vertical; min-height: 120px; white-space: pre-wrap;">{content}</pre>
</div>
