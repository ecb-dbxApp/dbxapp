<div class="dbx-panel dbxReport dbx-admin-dashboard-panel dbx-admin-dashboard-activity" id="dbx_admin_dashboard_activity_{i}" data-dbx="lib=report|form=0">
   {obj:activity_bar}
   <div class="dbx-admin-dashboard-panel-body">
      <div class="dbx-admin-dashboard-activity-list">
         <hr class="dbx_split">
         <div class="dbx-admin-dashboard-activity-row dbx-admin-dashboard-activity-{tone}">
            <i class="bi {icon}"></i>
            <div>
               <strong>{title}</strong>
               <small>{meta}</small>
            </div>
            <time>{time}</time>
         </div>
         <hr class="dbx_split">
      </div>
   </div>
   [dbx:js]
</div>
