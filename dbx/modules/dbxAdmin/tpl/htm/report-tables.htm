<div class="dbx-panel dbxReport dbxForm_wrapper" id="dbx_target_{i}">[tpl=dbx|module-bar]
 <div class="dbx-panel-body">
  <form action="{action}" class="dbxAjax" method="post" id="dbx_form_{i}">
   <div class="table-responsive">
    <table class="table table-striped table-bordered table-hover">
     <thead class="thead-light">
      <tr class="{tr-class}">[rpt:row]</tr>
     </thead>
     <tbody>
      <hr class="dbx_split">
      <tr class="{tr-class}">[rpt:row]</tr>
      <hr class="dbx_split">
     </tbody>
     <tfooter>
      <tr>
       <td colspan="{rpt:col_count}">
        <div class="row align-items-center">
         <div class="col">{obj:maction_select}</div>
         <div class="col">{obj:maction_submit}</div>
        </div>
       </td>
      </tr>
     </tfooter>
    </table>
   </div>
  </form>
 </div>
 [dbx:js]
</div>
