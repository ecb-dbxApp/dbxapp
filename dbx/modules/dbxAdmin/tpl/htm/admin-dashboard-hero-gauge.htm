<div class="dbx-admin-dashboard-hero-gauge dbx-admin-dashboard-hero-gauge-{tone}" data-admin-hero-gauge="{tone}">
   <div class="dbx-admin-dashboard-hero-gauge-head">
      <i class="bi {icon}"></i>
      <span>{label}</span>
   </div>
   <canvas width="150" height="92" data-admin-gauge="1" data-admin-gauge-value="{raw}" data-admin-gauge-max="{max}" data-admin-gauge-tone="{tone}" aria-hidden="true"></canvas>
   <div class="dbx-admin-dashboard-hero-gauge-value">
      <strong>{value}</strong>
      <small>{subtitle}</small>
   </div>
</div>
