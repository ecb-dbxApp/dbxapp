<article class="dbx-admin-dashboard-speedometer dbx-admin-dashboard-speedometer-{tone}">
   {bar}
   <div class="dbx-admin-dashboard-speedometer-body">
      <canvas width="190" height="126" data-admin-gauge="1" data-admin-gauge-value="{raw}" data-admin-gauge-max="{max}" data-admin-gauge-tone="{tone}" aria-hidden="true"></canvas>
      <div class="dbx-admin-dashboard-speedometer-value">
         <strong>{value}</strong>
         <em>{detail}</em>
         <small>{subtitle}</small>
      </div>
   </div>
</article>
