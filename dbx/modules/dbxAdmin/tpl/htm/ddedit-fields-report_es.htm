<div id="dbx_ddedit_fields_{i}" class="dbx-panel dbxReport dbx-report dbx-ddedit-report dbx-ddedit-fields-report" data-dbx="lib=report|form=0" data-ddedit-report="fields" data-modul="{modul}" data-dd="{dd}">
 <div class="dbx-ddedit-report-head d-flex justify-content-between align-items-center gap-3 flex-wrap">
  <div>
   <h5 class="mb-1"><i class="bi bi-list-columns me-1"></i>Lista sobre el terreno</h5>
   <div class="text-muted small">{count} Campos</div>
  </div>
  <details class="dbx-ddedit-new-box">
   <summary class="btn btn-outline-primary btn-sm">
    <i class="bi bi-plus-lg me-1"></i>Nuevo campo
   </summary>
   <div class="dbx-ddedit-new-form mt-3">
    {obj:new_field_form}
   </div>
  </details>
 </div>

 <div class="dbx-ddedit-sort-info text-muted small mt-2">
  <i class="bi bi-grip-vertical"></i> Cambiar y guardar el orden izquierda por drag &apos; drop.
 </div>

 <div class="dbx-ddedit-list dbx-ddedit-field-list mt-3">
<hr class="dbx_split">
[tpl=dbxAdmin|ddedit-field-row]
<hr class="dbx_split">
 </div>
</div>
