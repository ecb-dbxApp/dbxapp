<form action="{cache_save_url}" method="post" id="dbx_form_{i}" class="dbx-admin-dashboard-cache-bar-form dbxAjax"
      data-ajax-target="dbx_admin_dashboard_cache_body" data-ajax-mode="html" data-ajax-replace="target">
 [dbx:form]
 <div class="form-check form-switch">
  <input class="form-check-input" type="checkbox" role="switch" id="dbx_content_page_cache_enabled_{i}" name="cache_content" value="1" {cache_enabled_checked}>
  <label class="form-check-label" for="dbx_content_page_cache_enabled_{i}">New guest sites cache</label>
 </div>
 <button type="submit" class="btn btn-sm btn-outline-primary">
  <i class="bi bi-check2-circle"></i> Save
 </button>
 <a class="btn btn-warning btn-sm dbxAjax dbxConfirm"
    href="{cache_flush_url}" data-dbx-tooltip="Page cache empty"
    data-ajax-target="dbx_admin_dashboard_cache_body"
    data-ajax-mode="html"
    data-ajax-replace="target"
    data-confirm-title="<i class='bi bi-trash3'></i> Page cache empty"
    data-confirm="Are page caches completely empty?"
    data-confirm-hint="<small>The cached guest full pages are removed. With active cache writing, they are recreated at the next valid permalink call.</small>"
    data-confirm-buttons="yesno"
    role="button">
  <i class="bi bi-trash3"></i> Cache empty
 </a>
 <a class="btn btn-sm btn-outline-primary dbxAjax"
    href="{sitemap_rebuild_url}" data-dbx-tooltip="Creating a new sitemap"
    data-ajax-target="dbx_admin_dashboard_cache_body"
    data-ajax-mode="html"
    data-ajax-replace="target"
    role="button">
  <i class="bi bi-diagram-3"></i> Creating a new sitemap
 </a>
</form>
{bar_extra}
