[tpl=dbx|report-panel-head]
 <form action="?dbx_modul=dbxAdmin&dbx_run1={dbx_run1}" method="post" id="dbx_form_{i}">
   [tpl=dbx|report-form-select]
  [dbx:pagination]
  <table class="table table-striped table-bordered table-light" data-toggle="table">
   <thead>
    <tr class="{tr-class}">[rpt:row]</tr>
   </thead>
   <tbody>
    <hr class="dbx_split">
    <tr class="{tr-class}">[rpt:row]</tr>
    <hr class="dbx_split">
   </tbody>
   <tfoot>
    <tr>
     <td colspan="{rpt:col_count}">{obj:rows_delete}</td>
    </tr>
   </tfoot>
  </table>
  [dbx:js]
 </form>
[tpl=dbx|report-panel-foot]
