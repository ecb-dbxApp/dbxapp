<h4>Purpose</h4>
<p>Backup and restore SQLite databases via the admin.</p>
<h4>Procedure</h4>
<ol>
<li>Create backup before structural changes.</li>
<li>Restore only on test/dev environment or with caution on production.</li>
</ol>
<div class="help-example"><strong>Example:</strong> Before DD-Reset Backup → Apply → for Error Restore.</div>
