<article id="dbx_target_{i}" class="c-cms default dbx-documentation-page">
  <header class="title"><h2 class="cms-title">{cms:title}</h2></header>
  <aside class="dbx-doc-meta" aria-label="Estado del documento">
    <span><small>Tipo</small><strong>{doc:type}</strong></span>
    <span><small>Destinatarios</small><strong>{doc:audience}</strong></span>
    <span><small>Válido para</small><strong>dbxapp {dbx:version}</strong></span>
    <span><small>Actualizado</small><strong>{doc:date}</strong></span>
    <a href="{permalink}" rel="canonical"><small>Fuente</small><strong>Página canónica</strong></a>
  </aside>
  <section class="gallery {cms:gallery_class}"><div class="gallery-list" style="{gallery:style}"{gallery:data_dbx}>{cms:gallery}</div></section>
  <section class="body body-1">{cms:col1}</section>
  <footer class="footer">{cms:footer}</footer>
</article>
