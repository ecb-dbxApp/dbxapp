<section class="container py-4 dbx-content-missing-navigation">
  <div class="alert alert-warning shadow-sm" role="status">
    <span class="text-uppercase small fw-semibold">Hinweis</span>
    <h1 class="h2 mt-2">Die angeforderte Seite wurde nicht gefunden</h1>
    <p>Für <code>{requested_permalink}</code> ist kein Inhalt hinterlegt. Wählen Sie eine vorhandene Seite aus der Übersicht.</p>
    <div class="d-flex flex-wrap gap-2">
      <a class="btn btn-primary" href="{home_url}">Zur Startseite</a>
      <a class="btn btn-outline-primary" href="{sitemap_url}">XML-Sitemap</a>
    </div>
  </div>
  <div class="card shadow-sm">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h2 class="h4 mb-0">Seitenübersicht</h2>
      <span class="badge text-bg-primary">{page_count}</span>
    </div>
    <div class="card-body">
      <ul class="list-group list-group-flush">{page_rows}</ul>
    </div>
  </div>
</section>
