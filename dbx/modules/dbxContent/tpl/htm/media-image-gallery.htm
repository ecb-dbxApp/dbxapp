<figure class="dbx-media dbx-media-image dbx-media-gallery-item">
 <a class="dbx-gallery-link" href="{url}" data-dbx-gallery-item data-title="{title}" data-caption="{caption}">
  <img src="{thumb_url}" alt="{alt}"{thumb_dimensions} sizes="{image_sizes}" loading="lazy" fetchpriority="low" decoding="async" data-full-src="{url}">
 </a>
 <figcaption>{caption}</figcaption>
</figure>
