<figure class="dbx-media dbx-media-image dbx-media-hero dbx-media-hero-{hero_variant} {hero_sticky_class} {hero_scroll_class}" style="margin-top:{hero_margin_top};max-height:{hero_height};">
 <a class="dbx-hero" data-title="{title}" data-caption="{caption}">
  <img src="{url}" alt="{alt}"{image_dimensions} sizes="{image_sizes}" loading="eager" fetchpriority="high" decoding="async">
 </a>
 <figcaption>{caption}</figcaption>
</figure>
