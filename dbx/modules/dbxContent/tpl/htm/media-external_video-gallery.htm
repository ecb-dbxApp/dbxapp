<figure class="dbx-media dbx-media-video dbx-media-external-video dbx-media-gallery-item">
 <a class="dbx-gallery-link dbx-gallery-video-link" href="{url}" data-dbx-gallery-item data-media-type="external_video" data-poster="{poster_url}" data-title="{title}" data-caption="{caption}">
  <img src="{thumb_url}" alt="{alt}" loading="lazy">
  <span class="dbx-gallery-play"><i class="bi bi-play-fill"></i></span>
 </a>
 <figcaption>{caption}</figcaption>
</figure>
