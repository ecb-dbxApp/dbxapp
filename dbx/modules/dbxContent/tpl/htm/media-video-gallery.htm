<figure class="dbx-media dbx-media-video dbx-media-gallery-item">
 <a class="dbx-gallery-link dbx-gallery-video-link" href="{url}" data-dbx-gallery-item data-media-type="video" data-title="{title}" data-caption="{caption}">
  <video preload="metadata" muted playsinline poster="{poster_url}" src="{url}"></video>
  <span class="dbx-gallery-play"><i class="bi bi-play-fill"></i></span>
 </a>
 <figcaption>{caption}</figcaption>
</figure>
