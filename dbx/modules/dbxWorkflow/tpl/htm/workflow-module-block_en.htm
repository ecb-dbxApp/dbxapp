<div class="col-12">
  <div class="dbx-workflow-module-block">
    <div class="dbx-workflow-module-head">
      <div>
        <label class="form-label fw-semibold mb-1">{label}</label>
        <div class="form-text">Open the appropriate form, save the data there and then confirm this step.</div>
      </div>
      <div class="dbx-workflow-module-links">
        {module_links}
      </div>
    </div>
    <label class="dbx-workflow-done-check">
      <input class="form-check-input" type="checkbox" name="form_value" value="{complete_value}" required>
      <span>{complete_label}</span>
    </label>
  </div>
</div>
