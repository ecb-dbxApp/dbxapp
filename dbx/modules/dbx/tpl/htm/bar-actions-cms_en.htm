<div class="dbx-cms-head-editor-actions d-flex align-items-center gap-2">
 <button type="button" class="btn btn-primary btn-sm dbx-form-save" data-cms-action="save" data-dbx-tooltip="Save page" aria-label="Save page">
  <i class="bi bi-save"></i>
 </button>
 <button type="button" class="btn btn-outline-primary btn-sm" data-cms-action="lng-provision" data-dbx-tooltip="Translate into other languages">
  <i class="bi bi-translate"></i>
 </button>
 <button type="button" class="btn btn-outline-primary btn-sm" data-cms-action="lng-reset-sync" data-dbx-tooltip="Re-enable auto-sync for language versions">
  <i class="bi bi-link-45deg"></i>
 </button>
 <button type="button" class="btn btn-outline-danger btn-sm" data-cms-action="delete" data-dbx-tooltip="Delete page" aria-label="Delete page">
  <i class="bi bi-trash"></i>
 </button>
 <button type="button" class="btn btn-outline-secondary btn-sm" data-cms-action="preview" data-dbx-tooltip="Preview">
  <i class="bi bi-eye"></i>
 </button>
 <span class="dbx-cms-dirty" data-cms-dirty-state data-dbx-tooltip="Unsaved changes">
  <i class="bi bi-circle-fill"></i><span>Saved</span>
 </span>
</div>
<button type="button" class="btn btn-success btn-sm" data-cms-action="new-page" data-dbx-tooltip="New page">
 <i class="bi bi-file-earmark-plus"></i>
</button>
<button type="button" class="btn btn-outline-success btn-sm" data-cms-action="duplicate-page" data-dbx-tooltip="Duplicate selected page" aria-label="Duplicate selected page">
 <i class="bi bi-files"></i>
</button>
<button type="button" class="btn btn-outline-secondary btn-sm" data-cms-action="reload" data-dbx-tooltip="Reload">
 <i class="bi bi-arrow-clockwise"></i>
</button>
