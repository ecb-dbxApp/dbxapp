<div class="dbx-cms-head-editor-actions d-flex align-items-center gap-2">
 <button type="button" class="btn btn-primary btn-sm dbx-form-save" data-cms-action="save" title="Save page" aria-label="Save page">
  <i class="bi bi-save"></i>
 </button>
 <button type="button" class="btn btn-outline-primary btn-sm" data-cms-action="lng-provision" title="Translate into other languages">
  <i class="bi bi-translate"></i>
 </button>
 <button type="button" class="btn btn-outline-primary btn-sm" data-cms-action="lng-reset-sync" title="Re-enable auto-sync for language versions">
  <i class="bi bi-link-45deg"></i>
 </button>
 <button type="button" class="btn btn-outline-danger btn-sm" data-cms-action="delete" title="Delete page" aria-label="Delete page">
  <i class="bi bi-trash"></i>
 </button>
 <button type="button" class="btn btn-outline-secondary btn-sm" data-cms-action="preview" title="Preview">
  <i class="bi bi-eye"></i>
 </button>
 <span class="dbx-cms-dirty" data-cms-dirty-state title="Unsaved changes">
  <i class="bi bi-circle-fill"></i><span>Saved</span>
 </span>
</div>
<button type="button" class="btn btn-success btn-sm" data-cms-action="new-page" title="New page">
 <i class="bi bi-file-earmark-plus"></i>
</button>
<button type="button" class="btn btn-outline-success btn-sm" data-cms-action="duplicate-page" title="Duplicate selected page" aria-label="Duplicate selected page">
 <i class="bi bi-files"></i>
</button>
<button type="button" class="btn btn-outline-secondary btn-sm" data-cms-action="reload" title="Reload">
 <i class="bi bi-arrow-clockwise"></i>
</button>
