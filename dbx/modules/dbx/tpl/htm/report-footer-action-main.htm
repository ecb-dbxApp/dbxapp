<div class="dbx-report-footer-main">
 <label class="dbx-report-footer-label" for="{action_id}"><i class="bi bi-lightning-fill"></i><span>Aktion</span></label>
 <select id="{action_id}" class="form-select form-select-sm" data-report-action="picker">
  <option value="">Bitte wählen...</option>
  {report_action_options}
 </select>
 <button type="button" class="btn btn-primary btn-sm" data-report-action="run" title="Aktion ausführen"><i class="bi bi-play-fill"></i><span>Ausführen</span></button>
 <div class="dbx-report-footer-action-links" hidden>
  {report_action_links}
 </div>
</div>
