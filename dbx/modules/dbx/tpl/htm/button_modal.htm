<a class="{class} dbx-win" style="{style}" href="{url}"
   data-dbx="lib=openWin|url={url}|title={title}|modal=1|width=92%|height=88%"
   data-title="{title}" data-url="{url}" data-modal-class="{modalClass}"
   data-return-js="{returnJs}" data-is-prompt="{isPrompt}"
   data-select-value-class="{selectValueClass}" data-select-target="{selectTarget}"
   role="button">
 {buttonText}
</a>
