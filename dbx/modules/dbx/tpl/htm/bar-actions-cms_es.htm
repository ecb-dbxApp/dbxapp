<div class="dbx-cms-head-editor-actions d-flex align-items-center gap-2">
 <button type="button" class="btn btn-primary btn-sm dbx-form-save" data-cms-action="save" title="Guardar página" aria-label="Guardar página">
  <i class="bi bi-save"></i>
 </button>
 <button type="button" class="btn btn-outline-primary btn-sm" data-cms-action="lng-provision" title="Traducir a otros idiomas">
  <i class="bi bi-translate"></i>
 </button>
 <button type="button" class="btn btn-outline-primary btn-sm" data-cms-action="lng-reset-sync" title="Reactivar la sincronización automática de versiones de idioma">
  <i class="bi bi-link-45deg"></i>
 </button>
 <button type="button" class="btn btn-outline-danger btn-sm" data-cms-action="delete" title="Eliminar página" aria-label="Eliminar página">
  <i class="bi bi-trash"></i>
 </button>
 <button type="button" class="btn btn-outline-secondary btn-sm" data-cms-action="preview" title="Vista previa">
  <i class="bi bi-eye"></i>
 </button>
 <span class="dbx-cms-dirty" data-cms-dirty-state title="Cambios sin guardar">
  <i class="bi bi-circle-fill"></i><span>Guardado</span>
 </span>
</div>
<button type="button" class="btn btn-success btn-sm" data-cms-action="new-page" title="Nueva página">
 <i class="bi bi-file-earmark-plus"></i>
</button>
<button type="button" class="btn btn-outline-success btn-sm" data-cms-action="duplicate-page" title="Duplicar la página seleccionada" aria-label="Duplicar la página seleccionada">
 <i class="bi bi-files"></i>
</button>
<button type="button" class="btn btn-outline-secondary btn-sm" data-cms-action="reload" title="Recargar">
 <i class="bi bi-arrow-clockwise"></i>
</button>
