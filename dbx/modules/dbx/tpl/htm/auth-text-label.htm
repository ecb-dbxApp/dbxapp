<div class="dbx-auth-field {field_class}">
 <span class="dbx-auth-field-icon"><i class="bi {icon}"></i></span>
 <div class="fld-frame" style="{style}">
  <label for="{name}_{i}" data-dbx-errormsg="{errormsg}" class="control-label">{label}:{tooltip}</label>
  <input type="text" class="form-control {class}" id="{name}_{i}" name="{name}" placeholder="{placeholder}" value="{value}" {required} data-dbx-errormsg="{errormsg}">
 </div>
</div>
