<div class="dbx-input-clearable dbx-search-wrap {wrap_class}" data-dbx-role="{data_role}" style="{wrap_style}">
 <span class="dbx-search-icon" aria-hidden="true"><i class="bi bi-search"></i></span>
 <input type="text"
        id="{name}_{i}"
        name="{name}"
        class="form-control dbx-search dbx-clearable {input_class} {class}"
        placeholder="{placeholder}"
        value="{value}"
        data-dbx-errormsg="{errormsg}"
        {extra_attrs}
        autocomplete="off"
        spellcheck="false">
 <button type="button" class="dbx-clear-btn" aria-label="{ui:reset_search}" data-dbx-tooltip="{ui:reset_search}" hidden><i class="bi bi-x-lg" aria-hidden="true"></i></button>
</div>
