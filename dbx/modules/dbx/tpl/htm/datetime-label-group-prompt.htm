<div class="form-group">
  <label for="{name}_{i}" data-dbx-tooltip="{tooltip}" data-dbx-errormsg="{errormsg}" class="col-sm-2 control-label">{label}:</label>
  <div class="col-sm-10">
    <input type="datetime-local" class="form-control {class}" id="{name}_{i}" name="{name}" placeholder="{placeholder}" value="{value}" {required} data-dbx-tooltip="{tooltip}" data-dbx-errormsg="{errormsg}">
  </div>
</div>
