<div class="dbx-cms-head-editor-actions d-flex align-items-center gap-2">
 <button type="button" class="btn btn-primary btn-sm dbx-form-save" data-cms-action="save" title="Seite speichern" aria-label="Seite speichern">
  <i class="bi bi-save"></i>
 </button>
 <button type="button" class="btn btn-outline-primary btn-sm" data-cms-action="lng-provision" title="In andere Sprachen uebertragen">
  <i class="bi bi-translate"></i>
 </button>
 <button type="button" class="btn btn-outline-primary btn-sm" data-cms-action="lng-reset-sync" title="Auto-Sync fuer Sprachversionen wieder aktivieren">
  <i class="bi bi-link-45deg"></i>
 </button>
 <button type="button" class="btn btn-outline-danger btn-sm" data-cms-action="delete" title="Seite loeschen" aria-label="Seite loeschen">
  <i class="bi bi-trash"></i>
 </button>
 <button type="button" class="btn btn-outline-secondary btn-sm" data-cms-action="preview" title="Vorschau">
  <i class="bi bi-eye"></i>
 </button>
 <span class="dbx-cms-dirty" data-cms-dirty-state title="Ungespeicherte Aenderungen">
  <i class="bi bi-circle-fill"></i><span>Gespeichert</span>
 </span>
</div>
<button type="button" class="btn btn-success btn-sm" data-cms-action="new-page" title="Neue Seite">
 <i class="bi bi-file-earmark-plus"></i>
</button>
<button type="button" class="btn btn-outline-success btn-sm" data-cms-action="duplicate-page" title="Ausgewaehlte Seite duplizieren" aria-label="Ausgewaehlte Seite duplizieren">
 <i class="bi bi-files"></i>
</button>
<button type="button" class="btn btn-outline-secondary btn-sm" data-cms-action="reload" title="Neu laden">
 <i class="bi bi-arrow-clockwise"></i>
</button>
