<div class="dbx-auth-field {field_class}">
 <span class="dbx-auth-field-icon"><i class="bi {icon}"></i></span>
 <label for="{name}_{i}" class="control-label" data-dbx-errormsg="{errormsg}">{label}:</label>
 <input type="password" class="form-control {class}" id="{name}_{i}" name="{name}" placeholder="{placeholder}" value="{value}" data-dbx-errormsg="{errormsg}" {required} data-dbx-tooltip="{tooltip}">
 <button type="button" class="dbx-auth-password-toggle" data-dbx-password-toggle="{name}_{i}" aria-label="Show password" title="Show password" aria-pressed="false"><i class="bi bi-eye" aria-hidden="true"></i></button>
</div>
