<article class="dbx-design-card">
 <div class="dbx-design-card-preview" aria-hidden="true"></div>
 <div class="dbx-design-card-body">
  <div class="dbx-design-card-head"><div><h3>{title}</h3><code>{name}</code></div><span class="badge text-bg-light">{layout}</span></div>
  <div class="dbx-design-card-badges">{badges}</div>
  <p>{description}</p>
  <div class="dbx-design-card-actions">
   <a class="btn btn-primary btn-sm" href="{wizard_url}"><i class="bi bi-sliders"></i> {action_personalize}</a>
   <a class="btn btn-outline-primary btn-sm" href="{ki_url}"><i class="bi bi-stars"></i> {action_ai}</a>
   <a class="btn btn-outline-secondary btn-sm" href="{preview_url}" target="_blank"><i class="bi bi-eye"></i> {action_preview}</a>
   <a class="btn btn-outline-secondary btn-sm" href="{download_url}" title="{action_backup}"><i class="bi bi-download"></i></a>
  </div>
 </div>
</article>
