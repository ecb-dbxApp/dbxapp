<h4>Rechnungen verwalten</h4>
<p>Das Modul erstellt, bearbeitet und verwaltet Rechnungen mit ihren Positionen.</p>
<ul>
 <li>Installieren Sie zuerst die benötigten Tabellen.</li>
 <li>Legen Sie Rechnungen über die Übersicht neu an.</li>
 <li>Pflegen Sie Positionen direkt in der gewählten Rechnung.</li>
</ul>
