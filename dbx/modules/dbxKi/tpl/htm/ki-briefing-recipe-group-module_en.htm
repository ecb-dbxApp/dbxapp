<section class="dbx-ki-recipe-group mb-4">
 <h2 class="h6 text-uppercase text-muted mb-3">Modules</h2>
 <div class="row g-3">
  <div class="col-md-6">
   <div class="card h-100">
    <div class="card-body d-flex flex-column">
     <h3 class="h5"><i class="bi bi-plus-square me-2"></i>Create new module</h3>
     <p class="small text-muted flex-grow-1">Open the module wizard; afterwards it continues straight to the Module AI</p>
     <a class="btn btn-primary" href="{module_new_url}">Open form</a>
    </div>
   </div>
  </div>
  <div class="col-md-6">
   <div class="card h-100">
    <div class="card-body d-flex flex-column">
     <h3 class="h5"><i class="bi bi-box-seam me-2"></i>Edit existing module</h3>
     <p class="small text-muted flex-grow-1">Complete module as context, strict dbxapp rules, response ZIP</p>
     <a class="btn btn-primary" href="{module_edit_url}">Open form</a>
    </div>
   </div>
  </div>
 </div>
</section>
