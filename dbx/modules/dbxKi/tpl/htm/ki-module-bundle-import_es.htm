<div class="dbx-panel dbx-ki-module-bundle">
 [tpl=dbx|module-bar]
 <div class="container py-3" style="max-width:980px">
  <div class="card border-primary shadow-sm">
   <div class="card-body p-3 p-xl-4">
    <h2 class="h4 mb-2"><i class="bi bi-upload"></i> Módulo de importación</h2>
    <p class="text-muted">Importado uno <code>antwort.zip</code> con <code>manifest.json</code>, <code>job.json</code> y opcionales <code>assets/</code>. dbxKi Compruebe el esquema fijo, crear una copia de seguridad del módulo y realizar acciones permitidas.</p>
    <form method="post" enctype="multipart/form-data" action="{import_url}">
     {obj:form_msg}
     <div class="mb-3">
      <label class="form-label fw-semibold">Responder ZIP</label>
      <input class="form-control form-control-lg" type="file" name="bundle_zip" accept=".zip" required>
     </div>
     <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-primary btn-lg" type="submit"><i class="bi bi-play-fill"></i> Importación y exportación</button>
      <a class="btn btn-outline-secondary btn-lg" href="{back_url}">Atrás</a>
     </div>
     [dbx:form]
    </form>
   </div>
  </div>
 </div>
</div>
