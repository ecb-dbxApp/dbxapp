<div class="dbx-panel dbx-ki-module-bundle">
 {form:bar}
 <div class="container py-3" style="max-width:980px">
  <div class="card border-primary shadow-sm">
   <div class="card-body p-3 p-xl-4">
    <h2 class="h4 mb-2"><i class="bi bi-upload"></i> Import module AI response</h2>
    <p class="text-muted">Import an <code>antwort.zip</code> with unchanged contract and <code>answer.json</code>. dbxKi previews, stages, tests and can roll back the module change.</p>
    <form method="post" enctype="multipart/form-data" action="{import_url}">
     {form:message}
     <div class="mb-3">
      <label class="form-label fw-semibold">Reply ZIP</label>
      <input class="form-control form-control-lg" type="file" name="bundle_zip" accept=".zip" required>
     </div>
     <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-primary btn-lg" type="submit"><i class="bi bi-play-fill"></i> Import and export</button>
      <a class="btn btn-outline-secondary btn-lg" href="{back_url}">Back</a>
     </div>
     [dbx:form]
     {form:footer}
 </form>
   </div>
  </div>
 </div>
</div>
