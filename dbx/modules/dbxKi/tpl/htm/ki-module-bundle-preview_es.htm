<div class="dbx-panel">
 [tpl=dbx|module-bar]
 <div class="p-3">
  <div class="alert alert-info mb-3"><i class="bi bi-info-circle" aria-hidden="true"></i> Respuesta comprobada. Todavía no se ha cambiado nada.</div>
  <h3 class="h6">Pasos planificados</h3>
  <ul class="list-group mb-3">{step_items}</ul>
  {run_panel}
  <div class="d-flex flex-wrap gap-2 justify-content-end">
   <button type="button" class="btn btn-outline-danger" data-dbx-ki-discard="{discard_url}" data-confirm="¿Descartar esta respuesta de módulo? Los cambios no se aplicarán.">
    <i class="bi bi-x-lg" aria-hidden="true"></i> Descartar
   </button>
   <button type="button" class="btn btn-primary" data-dbx-ki-inline-action="{execute_url}" data-confirm="¿Aplicar ahora los cambios revisados del módulo? Antes se creará automáticamente una copia de seguridad.">
    <i class="bi bi-check2-circle" aria-hidden="true"></i> Aplicar
   </button>
  </div>
 </div>
</div>
