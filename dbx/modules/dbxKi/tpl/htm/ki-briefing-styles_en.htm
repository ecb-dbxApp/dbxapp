<div class="dbx-panel dbx-ki-briefing-styles" data-dbx="lib=confirm|class=dbxConfirm|bind=button">
 {form:bar}
 <div class="container py-4" style="max-width: 960px;">
  <p class="text-muted small">Writing styles are inserted into AI contracts as a tone default. Standard values are in <code>cfg/writing_styles.php</code>; stored values overwrite them in the module config.</p>

  <form method="post" action="{save_url}">
   {form:message}
   <div class="table-responsive">
    <table class="table table-sm align-middle">
     <thead>
      <tr>
       <th style="width:12rem">Keys</th>
       <th style="width:14rem">Designation</th>
       <th>AI prompt</th>
      </tr>
     </thead>
     <tbody id="dbx-ki-styles-rows">
      {style_rows}
     </tbody>
    </table>
   </div>
   <div class="d-flex flex-wrap gap-2 mt-3">
    <button type="button" class="btn btn-outline-secondary btn-sm" id="dbx-ki-style-add"><i class="bi bi-plus"></i> Line</button>
    <button type="submit" class="btn btn-primary" name="styles_action" value="save"><i class="bi bi-check-lg"></i> Save</button>
    <button type="submit" class="btn btn-outline-warning btn-sm dbxConfirm"
            name="styles_action" value="reset"
            data-confirm-title="Resetting writing styles?"
            data-confirm="All stored writing styles are replaced by the default values."
            data-confirm-buttons="yesno">
     Restore standard
    </button>
   </div>
   [dbx:form]
   {form:footer}
 </form>

  <template id="dbx-ki-style-row-tpl">
   <tr>
    <td><input class="form-control form-control-sm" name="style_key[]" placeholder="For example, factually"></td>
    <td><input class="form-control form-control-sm" name="style_label[]" placeholder="Designation"></td>
    <td><textarea class="form-control form-control-sm" name="style_prompt[]" rows="2" placeholder="Instruction for AI"></textarea></td>
   </tr>
  </template>
  <script>
  (function(){
    var add = document.getElementById('dbx-ki-style-add');
    var body = document.getElementById('dbx-ki-styles-rows');
    var tpl = document.getElementById('dbx-ki-style-row-tpl');
    if (add && body && tpl) {
      add.addEventListener('click', function(){
        body.appendChild(tpl.content.cloneNode(true));
      });
    }
  })();
  </script>
 </div>
</div>
