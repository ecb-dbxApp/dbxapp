<div class="dbx-panel">
 [tpl=dbx|module-bar]
 <div class="p-3">
  <div class="alert alert-info mb-3"><i class="bi bi-info-circle" aria-hidden="true"></i> Antwort geprüft. Noch wurde nichts geändert.</div>
  <h3 class="h6">Geplante Schritte</h3>
  <ul class="list-group mb-3">{step_items}</ul>
  {run_panel}
  <div class="d-flex flex-wrap gap-2 justify-content-end">
   <button type="button" class="btn btn-outline-danger" data-dbx-ki-discard="{discard_url}" data-confirm="Modul-Antwort wirklich verwerfen? Die Änderungen werden nicht übernommen.">
    <i class="bi bi-x-lg" aria-hidden="true"></i> Verwerfen
   </button>
   <button type="button" class="btn btn-primary" data-dbx-ki-inline-action="{execute_url}" data-confirm="Geprüfte Modul-Änderungen jetzt übernehmen? Vorher wird automatisch ein Backup angelegt.">
    <i class="bi bi-check2-circle" aria-hidden="true"></i> Übernehmen
   </button>
  </div>
 </div>
</div>
