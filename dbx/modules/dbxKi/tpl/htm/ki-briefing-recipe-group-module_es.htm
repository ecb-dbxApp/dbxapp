<section class="dbx-ki-recipe-group mb-4">
 <h2 class="h6 text-uppercase text-muted mb-3">Módulos</h2>
 <div class="row g-3">
  <div class="col-md-6">
   <div class="card h-100">
    <div class="card-body d-flex flex-column">
     <h3 class="h5"><i class="bi bi-plus-square me-2"></i>Crear nuevo módulo</h3>
     <p class="small text-muted flex-grow-1">Abrir el asistente de módulos; tras crearlo continúa directamente a la IA de módulos</p>
     <a class="btn btn-primary" href="{module_new_url}">Abrir formulario</a>
    </div>
   </div>
  </div>
  <div class="col-md-6">
   <div class="card h-100">
    <div class="card-body d-flex flex-column">
     <h3 class="h5"><i class="bi bi-box-seam me-2"></i>Editar módulo existente</h3>
     <p class="small text-muted flex-grow-1">Módulo completo como contexto, reglas estrictas de dbxapp, ZIP de respuesta</p>
     <a class="btn btn-primary" href="{module_edit_url}">Abrir formulario</a>
    </div>
   </div>
  </div>
 </div>
</section>
