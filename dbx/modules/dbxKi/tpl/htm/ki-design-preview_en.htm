<div class="dbx-panel">
 {form:bar}
 <div class="p-3">
  <div class="alert alert-info"><strong>{file_count} Files</strong> were safely unpacked. No design has been changed yet. {summary}</div>
  <div class="table-responsive mb-3"><table class="table table-sm align-middle"><thead><tr><th>File</th><th>Status</th><th class="text-end">Size</th></tr></thead><tbody>{file_rows}</tbody></table></div>
  <form method="post" action="{action}" class="dbxAjax" data-target="dbxForm_{i}">
   {obj:job_token}
   <div class="form_msg {msg_class}">{form:message}</div>
   <div class="d-flex flex-wrap gap-2 justify-content-end">
    <button type="button" class="btn btn-outline-danger" data-dbx-ki-discard="{discard_url}" data-confirm="Discard this response? The changes will not be applied."><i class="bi bi-x-lg"></i> Discard</button>
    <button class="btn btn-primary" type="submit" data-confirm="Apply the reviewed design changes now?"><i class="bi bi-check2-circle"></i> Apply reviewed result</button>
   </div>
   [dbx:form]
   {form:footer}
 </form>
 </div>
</div>
