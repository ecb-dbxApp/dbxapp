<div class="fld-frame">
 <label class="form-label small mb-1" for="{name}_{i}">{label}</label>
 <input type="file"
        class="form-control form-control-sm {class}"
        id="{name}_{i}"
        name="{name}"
        accept=".zip,application/zip"
        required
        data-dbx-tooltip="{tooltip}"
        data-dbx-errormsg="{errormsg}">
</div>
