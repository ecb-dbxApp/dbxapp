<div class="dbx-panel dbx-ki-translation-sync">
 [tpl=dbx|module-bar]
 <div class="container py-4">
  <form method="post" class="card p-3 mb-3" action="{action}">
   {obj:form_msg}
   <div class="row g-3">
    <div class="col-md-4">
     <label class="form-label">Del idioma</label>
     <select class="form-select" name="source_lng">{language_options}</select>
    </div>
    <div class="col-md-8">
     <label class="form-label d-block">Idioma objetivo</label>
     <div class="border rounded p-2 bg-light">{target_language_checkboxes}</div>
    </div>
    <div class="col-md-4">
     <label class="form-label">ID de carpeta raíz</label>
     <input class="form-control" type="number" name="root_folder_id" min="0" value="{root_folder_id}">
     <div class="form-text">0 significa lenguaje completo.</div>
    </div>
    <div class="col-md-8">
     <label class="form-label d-block">Opciones</label>
     <label class="form-check form-check-inline mb-2"><input class="form-check-input" type="checkbox" name="update_existing" value="1" {update_existing_checked}><span class="form-check-label">Actualizar las traducciones existentes</span></label>
     <label class="form-check form-check-inline mb-2"><input class="form-check-input" type="checkbox" name="skip_manual" value="1" {skip_manual_checked}><span class="form-check-label">Contenido objetivo manual</span></label>
     <label class="form-check form-check-inline mb-2"><input class="form-check-input" type="checkbox" name="copy_media" value="1" {copy_media_checked}><span class="form-check-label">Adoptar asignaciones de medios</span></label>
     <label class="form-check form-check-inline mb-2"><input class="form-check-input" type="checkbox" name="replace_media_usage" value="1" {replace_media_usage_checked}><span class="form-check-label">Sustitúyase las asignaciones de medios en el objetivo</span></label>
    </div>
   </div>
   <div class="d-flex flex-wrap gap-2 mt-3">
    <button class="btn btn-outline-primary" type="submit" name="sync_mode" value="preview">Vista previa</button>
    <button class="btn btn-primary" type="submit" name="sync_mode" value="execute">Ejecución</button>
   </div>
   [dbx:form]
  </form>
  {result_html}
 </div>
</div>
