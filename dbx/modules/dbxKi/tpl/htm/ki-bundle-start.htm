<div class="dbx-panel dbx-ki-bundle-start">
 [tpl=dbx|module-bar]
 <div class="container py-3" style="max-width: 920px;">
  <div class="card">
   <div class="card-body py-3">
    <p class="small text-muted mb-2">Fertige KI-ZIP mit Vertrag und <code>answer.json</code> importieren. Noch kein Auftrag?
     <a href="?dbx_modul=dbxKi&amp;dbx_run1=briefing">KI-Auftrag erstellen</a>.</p>
    <form method="post" action="{action}" enctype="multipart/form-data" class="dbxAjax" data-target="dbxForm_{i}">
     {obj:return_run1}
     <div class="mb-2">{obj:form_msg}</div>
     <div class="d-flex flex-wrap align-items-end gap-2">
      <div class="flex-grow-1" style="min-width:14rem">
       {obj:bundle_zip}
      </div>
      <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-upload"></i> Importieren</button>
     </div>
     [dbx:form]
    </form>
   </div>
  </div>
  <p class="small text-muted mt-2 mb-0">
   <a class="text-muted" href="{describe_url}" target="_blank">bundle.describe</a>
  </p>
 </div>
</div>
