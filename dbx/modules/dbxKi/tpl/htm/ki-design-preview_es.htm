<div class="dbx-panel">
 [tpl=dbx|module-bar]
 <div class="p-3">
  <div class="alert alert-info"><strong>{file_count} archivos</strong> se descomprimieron de forma segura. Todavía no se ha modificado ningún diseño. {summary}</div>
  <div class="table-responsive mb-3"><table class="table table-sm align-middle"><thead><tr><th>Archivo</th><th>Estado</th><th class="text-end">Tamaño</th></tr></thead><tbody>{file_rows}</tbody></table></div>
  <form method="post" action="{action}" class="dbxAjax" data-target="dbxForm_{i}">
   {obj:job_token}
   <div class="form_msg {msg_class}">{obj:form_msg}</div>
   <div class="d-flex flex-wrap gap-2 justify-content-end">
    <button type="button" class="btn btn-outline-danger" data-dbx-ki-discard="{discard_url}" data-confirm="¿Descartar esta respuesta? Los cambios no se aplicarán."><i class="bi bi-x-lg"></i> Descartar</button>
    <button class="btn btn-primary" type="submit" data-confirm="¿Aplicar ahora los cambios de diseño revisados?"><i class="bi bi-check2-circle"></i> Aplicar resultado revisado</button>
   </div>
   [dbx:form]
  </form>
 </div>
</div>
