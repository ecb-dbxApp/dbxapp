[tpl=dbx|panel-shell-head]
<section class="dbx-form-group">
  <p>Enter name and email address. You will then receive a personal download link with installation instructions.</p>
  <div class="row g-3 align-items-end">
    <div class="col-12 col-md-5">{obj:name}</div>
    <div class="col-12 col-md-5">{obj:email}</div>
    <div class="col-12 col-md-2">
      <button class="btn btn-primary w-100" type="submit">
        <i class="bi bi-envelope-arrow-up"></i>
        <span>Send link</span>
      </button>
    </div>
  </div>
</section>
[tpl=dbx|panel-shell-foot]
