<form class="dbx-cms-browser-external-video" data-cms-browser-external-video method="post" action="{action}">
 <input type="url" class="form-control form-control-sm" name="url" placeholder="YouTube-URL einfuegen">
 <input type="hidden" name="slot" value="inline">
 <button type="submit" class="btn btn-outline-primary btn-sm" title="YouTube-Video hinzufuegen">

 </button>
 [dbx:form]
</form>
