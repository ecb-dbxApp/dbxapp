<div class="dbx-cms-settings" data-cms-settings>
 <details class="dbx-cms-settings-panel" data-cms-ui-state="hero" open>
  <summary><i class="bi bi-chevron-right dbx-cms-toggle-icon"></i><span>Hero</span></summary>
 <div class="dbx-cms-settings-grid">
   <figure class="dbx-cms-hero-preview" data-cms-hero-preview>
    <div class="dbx-cms-hero-preview-empty">Kein Hero-Bild ausgewaehlt.</div>
   </figure>
   {obj:hero_template}
   {obj:hero_image_id}
   {obj:hero_margin_top}
   {obj:hero_height}
   {obj:hero_variant}
   {obj:hero_sticky}
   {obj:hero_scroll_layer}
   <div class="dbx-cms-hero-actions">
    <button type="button" class="btn btn-outline-primary btn-sm dbx-cms-hero-pick" data-cms-action="assign-hero-media" title="Hero-Bild aus dem Medienbrowser waehlen">
     <i class="bi bi-image"></i><i class="bi bi-camera-video"></i><i class="bi bi-upload"></i><span>Auswahl</span>
    </button>
    <button type="button" class="btn btn-primary btn-sm" data-cms-action="save-settings" title="Hero-Einstellungen speichern">
     <i class="bi bi-save"></i><span>Speichern</span>
    </button>
   </div>
  </div>
 </details>
 <details class="dbx-cms-settings-panel" data-cms-ui-state="gallery">
  <summary><i class="bi bi-chevron-right dbx-cms-toggle-icon"></i><span>Gallery</span></summary>
  <div class="dbx-cms-settings-grid">
   {obj:gallery_overflow}
   {obj:gallery_click_behavior}
   <div class="dbx-cms-settings-actions">
    <button type="button" class="btn btn-outline-primary btn-sm" data-cms-action="assign-media" data-cms-slot="gallery" title="Bilder aus dem Medienbrowser zur Gallery hinzufuegen">
     <i class="bi bi-images"></i><i class="bi bi-camera-video"></i><i class="bi bi-upload"></i><span>Auswahl</span>
    </button>
   <button type="button" class="btn btn-primary btn-sm" data-cms-action="save-settings" title="Gallery-Einstellungen speichern">
     <i class="bi bi-save"></i><span>Speichern</span>
    </button>
   </div>
  </div>
  <div class="dbx-cms-media-list" data-cms-media="gallery">
   <div class="dbx-cms-empty">Keine Medien in der Gallery.</div>
  </div>
 </details>
</div>
