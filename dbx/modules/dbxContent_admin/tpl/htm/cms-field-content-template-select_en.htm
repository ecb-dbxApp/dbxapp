<div class="dbx-cms-field dbx-cms-field-{name}" style="width: 100% !important; white-space: normal;">
 <div class="dbx-cms-field-labelbar">
  <label for="{name}_{i}">{label}</label>
  <a href="#" data-url="" class="btn-inline dbx-cms-content-template-edit"
     data-cms-content-template-edit
     data-title="Editing content templates"
     aria-label="Edit selected content template in the ACE editor"
     aria-disabled="false" tabindex="0" role="button"
     title="First select a c-* content template">
   <i class="bi bi-pencil-square" aria-hidden="true"></i>
  </a>
 </div>
 <select class="form-select {class}" id="{name}_{i}" name="{name}" data-cms-field="{cms_field}" data-cms-select-title style="width: 100%; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" {required}>{{name}_options}</select>
</div>
