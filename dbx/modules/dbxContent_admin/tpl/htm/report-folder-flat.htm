<div class="dbx-panel dbxReport dbxForm_wrapper" id="dbx_target_{i}" >  
 <div class="row"> 
    <div class="col">{obj:add_folder}</div> 
 </div>    
 <form action="{action}" class="dbxAjax dbxForm" method="post" id="dbx_form_{i}">  
 [tpl=dbx|report-form-select]
 [dbx:pagination]  
 <hr/>  
 <table id="dbx_table_{i}" class="bootstrap-table bootstrap5 table table-striped table-bordered table-light table-hover data-table"  
 data-toggle="-table"  
 data-search="true"  
 data-show-columns="true"  
 data-show-export="true"  
 data-id-field="id"  
 data-multiple-select-row="true"  
 data-multipleSelectRow="true"  
 data-click-to-select="true"  
 data-pagination="true"  
 >  
 <thead>  
   <tr class="{tr-class}">[rpt:row]</tr>
 </thead>  
 <tbody>  
 <hr class="dbx_split">  
 <tr class="{tr-class}">[rpt:row]</tr>
 <hr class="dbx_split">  
 <tfoot>  
 <tr>  
 <td colspan="{rpt:col_count}"><hr/></td>  
 </tr>  
 </tfoot>  
 </tbody>  
 </table>  
 </form>  
 [dbx:js]  
</div>
