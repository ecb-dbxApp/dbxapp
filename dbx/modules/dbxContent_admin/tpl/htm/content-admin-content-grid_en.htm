[tpl=dbx|panel-shell-head]
 <span class="d-none dbx-win-preload"></span>
 [tpl=modul|content-grid-toolbar]

 <div id="{grid_id}"
      data-dbx="
       lib=grid
       |id={grid_id}
       |layout={grid_layout}
       |responsiveLayout=0
       |height=560
       |minHeight=320
       |maxHeight=960
       |heightMin=320
       |heightMax=960
       |heightStep=40
       |cols={grid_cols}
       |read={read_url}
       |save={save_url}
       |delete={delete_url}
       |sync={sync_url}
       |allowDelete=1
       |allowEdit=1
       |allowInsert=0
       |movableColumns=1
       |resizableColumns=1
       |headerFilter=0
       |headerSort=1
       |headerSortStart=asc
       |pagination=0
       |paginationMode=local
       |pageSize=15
       |pageSizeSelector=1,5,15,25,50,100,*
       |paginationButtonCount=5
       |paginationCounter=rows
       |paginationControls=1
       |paginationAddRow=page
       |paginationOutOfRange=last
       |searchMode=local
       |searchPlaceholder=🔍
       |searchWidth=220
       |showSearch=1
       |showAutosave=1
       |showGridLines=1
       |showHeight=1
       |showReload=1
       |showReset=1
       |showSave=1
       |showInsert=0
       |showColumns=1
       |showSyncStatus=1
       |sync_run=1
       |sync_led=1
       |synctime={grid_synctime}
       |syncMode=delta
       |showExportExcel=1
       |showExportPdf=0
       |exportFileName=content-pages
       |exportSheetName=Content
      ">
 </div>
[tpl=dbx|panel-shell-foot]
