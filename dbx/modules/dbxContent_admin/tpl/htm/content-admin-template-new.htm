<section class="dbx-panel dbx-content-admin-template-new p-3">
 <header class="dbx-bar dbx-bar--module mb-3">
  <div class="dbx-bar-title">
   <i class="bi bi-file-earmark-plus"></i>
   <span class="dbx-bar-copy">
    <span class="dbx-bar-heading">Neues Content-Template</span>
    <span class="dbx-bar-subtitle">c-* Layout mit allen Bereichen anlegen</span>
   </span>
  </div>
  <div class="dbx-bar-actions">{help_button}</div>
 </header>
 {form:message}
 <form action="{action}" method="post" class="dbxAjax">
  <div class="mb-3">
   {obj:template_name}
   <div class="form-text">Dateiname ohne Endung. Wird als <code>c-name.htm</code> in <code>dbxContent/tpl/htm/</code> gespeichert.</div>
  </div>
  <div class="d-flex gap-2">
   <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> Anlegen</button>
  </div>
 </form>
</section>
