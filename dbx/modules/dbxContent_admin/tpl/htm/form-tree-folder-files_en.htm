<div id="dbx_target_{i}" class="dbx-panel dbxForm_wrapper"> 
 <form action="{action}" method="post" id="dbx_form_{i}" class="dbxAjax" enctype="multipart/form-data"> 
 
 <div class="row"><div class="col">{obj:form_msg}</div></div> 
 <div class="row"><div class="col">{obj:id}</div></div> 
 <div class="row"><div class="col">[dbx:form]</div></div> 
 <div class="row"><div class="col">{obj:root}</div></div> 
 <div class="row"><div class="col">{obj:modal}</div></div>

 <div class="col"><button class="btn btn-primary btn-lg btn-block" type="submit">Tree</button></div>

 <div class="row"><div class="col"> 
 
<ul id="tree_{i}" class="treeview" style="display: block;">

 </span> 
 </div> 
 [modul=dbxContent_admin]dbx_run1=list_folder_files&fid={id}[/modul] 
 [modul=dbxContent_admin]dbx_run1=list_files&fid={id}[/modul] 
 </li> 
 <hr class="dbx_split"> 
</ul> 
 
</div></div>
