<div class="dbx-form-field" data-cms-field-wrap="{cms_field}" data-cms-field-scope="{cms_field_scope}">
 <div class="dbx-form-field__labelbar">
  <label class="dbx-form-field__label" for="{name}_{i}">{label}</label>
  <a href="#" data-url="" class="btn-inline dbx-cms-content-template-edit"
     data-cms-content-template-edit
     data-title="{content_template_edit_title}"
     aria-label="{content_template_edit_aria}"
     aria-disabled="false" tabindex="0" role="button" data-dbx-tooltip="{content_template_select_first}">
   <i class="bi bi-pencil-square" aria-hidden="true"></i>
  </a>
 </div>
 <select class="form-select dbx-form-field__control {class}" id="{name}_{i}" name="{name}" data-cms-field="{cms_field}" data-cms-field-scope="{cms_field_scope}" data-cms-select-title {required}>{{name}_options}</select>
</div>
