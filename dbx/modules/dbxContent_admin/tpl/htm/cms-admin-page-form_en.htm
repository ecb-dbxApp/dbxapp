<form class="dbx-cms-form" data-cms-form>
 {obj:id}
 {obj:folder}
	<section class="dbx-form-group dbx-cms-page-section">
		<details class="dbx-cms-page-panel" data-cms-ui-state="page" open>
			<summary><i class="bi bi-chevron-right dbx-cms-toggle-icon dbx-cms-toggle-icon-closed"></i><i class="bi bi-chevron-down dbx-cms-toggle-icon dbx-cms-toggle-icon-open"></i><span>page</span></summary>
			<div class="dbx-cms-form-grid dbx-cms-form-grid-page">
				<div class="dbx-cms-system-field dbx-cms-system-field-title">{obj:title}</div>
				<div class="dbx-cms-system-field dbx-cms-system-field-menu-title">{obj:menu_title}</div>
				<div class="dbx-cms-system-field dbx-cms-system-field-permalink">{obj:permalink}</div>
				<div class="dbx-cms-system-field dbx-cms-system-field-template">{obj:template}</div>
				<div class="dbx-cms-system-field dbx-cms-system-field-activ">{obj:activ}</div>
				<div class="dbx-cms-system-field dbx-cms-system-field-description">{obj:description}</div>
				<div class="dbx-cms-system-field dbx-cms-system-field-keywords">{obj:keywords}</div>
			</div>
		</details>
	</section>
 <section class="dbx-form-group dbx-cms-editor-group">
  <div class="dbx-cms-editor" contenteditable="true" data-cms-editor></div>
  {obj:content}
 </section>
</form>
