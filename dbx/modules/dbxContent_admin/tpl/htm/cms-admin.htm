<!-- Request the editor scripts early. CMS styles are real stylesheets here,
     not only preloads: the CMS markup must never be painted unstyled while
     the JavaScript feature loader is still starting. -->
<style>.dbx-cms.dbx-cms-booting{height:calc(100vh - 190px);overflow:hidden;visibility:hidden}</style>
<link rel="preload" href="dbx/js/lib/cms.js?v={dbx:asset_version}" as="script" fetchpriority="high">
<link rel="preload" href="dbx/js/lib/cms-page.js?v={dbx:asset_version}" as="script" fetchpriority="high">
<link rel="preload" href="dbx/vendor/jodit/jodit.fat.min.js?v={dbx:asset_version}" as="script" fetchpriority="high">
<link rel="stylesheet" href="dbx/vendor/jodit/jodit.fat.min.css?v={dbx:asset_version}" fetchpriority="high" data-dbx-cms-critical="{i}">
<link rel="stylesheet" href="dbx/design/{dbx:design}/css/c-cms.css?v={dbx:asset_version}" fetchpriority="high" data-dbx-cms-critical="{i}">
<link rel="stylesheet" href="dbx/design/{dbx:design}/css/c-form.css?v={dbx:asset_version}" fetchpriority="high" data-dbx-cms-critical="{i}">
<link rel="stylesheet" href="dbx/design/{dbx:design}/css/c-grid.css?v={dbx:asset_version}" fetchpriority="high" data-dbx-cms-critical="{i}">
<div id="dbx_content_cms_{i}"
     class="dbx-panel dbx-cms dbxReport is-tree-collapsed dbx-cms-booting"
     data-cms-critical-style="{i}"
     data-cms-messages="{cms_messages}"
     data-cms-language="{current_lng}"
     data-dbx="lib=cms|id=dbx_content_cms_{i}|cid={cms_cid}|fid={cms_fid}|tree={tree_url}|page={page_url}|save={save_url}|deletepage={delete_page_url}|newpage={new_page_url}|duplicatepage={duplicate_page_url}|newfolder={new_folder_url}|savefolder={folder_save_url}|deletefolder={folder_delete_url}|movenode={move_node_url}|lngpreview={lng_preview_url}|lngprovision={lng_provision_url}|lngprovisiontree={lng_provision_tree_url}|lngresetsync={lng_reset_sync_url}|lngdeletepreview={lng_delete_preview_url}|masterlng={master_lng}|media={media_url}|mediafolders={media_folders_url}|mediafoldercreate={media_folder_create_url}|mediafolderdelete={media_folder_delete_url}|mediafolderrename={media_folder_rename_url}|mediamove={media_move_url}|mediaunused={media_unused_url}|mediaprocess={media_process_url}|upload={upload_url}|uploadmax={upload_max_bytes}|externalvideo={external_video_url}|removemedia={remove_media_url}|deletemedia={delete_media_url}|editmedia={edit_media_url}|setmediaslot={set_media_slot_url}|assignmedia={assign_media_url}|sortmedia={sort_media_url}|modcatalog={mod_catalog_url}|modmodules={mod_modules_url}">[tpl=dbxContent_admin|cms-admin-header]
[tpl=dbxContent_admin|cms-admin-frame]
 <div class="dbx-cms-status" data-cms-status></div>
 {media_browser_forms}
</div>
