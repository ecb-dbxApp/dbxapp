<form class="dbx-cms-folder-editor" data-cms-folder-editor data-cms-form-scope="folder" hidden>
 <div class="dbx-bar dbx-bar--module dbx-cms-folder-editor-bar">
  <div class="dbx-bar-title">
   <i class="bi bi-folder2-open" aria-hidden="true"></i>
   <span class="dbx-bar-copy">
    <strong class="dbx-bar-heading" data-cms-folder-title>{folder_form_title}</strong>
    <span class="dbx-bar-subtitle">{folder_form_subtitle}</span>
   </span>
  </div>
  <div class="dbx-bar-actions">
   {bar_extra}
   <button type="button" class="btn btn-outline-secondary btn-sm" data-cms-folder-close data-dbx-tooltip="{close_title}" aria-label="{folder_close_aria}">
    <i class="bi bi-x-lg"></i>
   </button>
  </div>
 </div>
 <div class="dbx-cms-folder-editor-body">
  {obj:id}
  <div class="dbx-form-grid dbx-cms-folder-grid">
   <div class="dbx-form-grid__item">{obj:name}</div>
   <div class="dbx-form-grid__item">{obj:parent_id}</div>
   <div class="dbx-form-grid__item">{obj:template}</div>
  </div>
  <div class="dbx-cms-folder-rights">
   {obj:group_read}
  </div>
  <div class="dbx-cms-folder-editor-actions">
   <button type="button" class="btn btn-outline-danger btn-sm" data-cms-action="delete-folder" data-cms-folder-delete data-dbx-tooltip="{folder_delete_title}">
    <i class="bi bi-trash"></i><span>{delete_label}</span>
   </button>
   <button type="button" class="btn btn-primary btn-sm" data-cms-action="save-folder" data-dbx-tooltip="{folder_save_title}">
    <i class="bi bi-check-lg"></i><span>{save_label}</span>
   </button>
  </div>
 </div>
</form>
