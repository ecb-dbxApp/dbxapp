<form class="dbx-cms-browser-external-video" data-cms-browser-external-video method="post" action="{action}">
 <input type="url" class="form-control form-control-sm" name="url" placeholder="Add YouTube URL">

 <button type="submit" class="btn btn-outline-primary btn-sm" title="Add YouTube video">

  <span>YouTube</span>
 </button>
 [dbx:form]
</form>
