<label class="dbx-form-field" data-cms-field-wrap="{cms_field}" data-cms-field-scope="{cms_field_scope}">
 <span class="dbx-form-field__label">{label}</span>
 <textarea class="form-control dbx-form-field__control {class}" id="{name}_{i}" name="{name}" data-cms-field="{cms_field}" data-cms-field-scope="{cms_field_scope}" maxlength="254" rows="2" placeholder="{placeholder}">{value}</textarea>
</label>
