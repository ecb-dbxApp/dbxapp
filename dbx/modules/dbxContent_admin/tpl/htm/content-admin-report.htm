<div class="dbx-panel dbxReport" id="dbx_target_{i}">
 <form action="{action}" method="post" id="dbx_form_{i}" class="dbxAjax"
       data-ajax-target="dbx_target_{i}" data-ajax-mode="html" data-ajax-replace="target">
  [dbx:pagination]
  <div class="table-responsive">
   <table class="table table-striped table-bordered table-hover align-middle">
    <thead>
     <tr class="{tr-class}">[rpt:row]</tr>
    </thead>
    <tbody>
     <hr class="dbx_split">
     <tr class="{tr-class}">[rpt:row]</tr>
     <hr class="dbx_split">
    </tbody>
   </table>
  </div>
  [dbx:js]
 </form>
</div>
