<div id="dbx_target_{i}" class="dbx-panel dbxForm_wrapper">
 <form class="dbxAjax" action="{action}" method="post" id="dbx_form_{i}" data-dbx_target='dbx_target_{i}' enctype="multipart/form-data">
  <div id="dbx_target_{i}_{iid}">
    <div class="row">
      <div class="col">{form:message}</div>
    </div>
    <div class="row">
      <div class="col">[dbx:form]</div>
    </div>
    <div class="row">
      <div class="col">{obj:obs_upload{iid}}</div>
    </div>
    <div class="row">
      <div class="col">{obj:upload{iid}}</div>
    </div>
    <div class="row">
      <div class="col">
        <div id="uploader_img_{i}_{iid}" class="btn btn-primary btn-sm btn-block" data-dbx_target='dbx_target_{i}_{iid}' data-dbx_get='?dbx_modul=dbxContent_admin&dbx_run1=images&iid={iid}&rid={rid}'>Imagen {iid} desde {rid} subida</div>
      </div>
    </div>
    <div class="row">
      <div class="col">{obj:button-modal}</div>
    </div>
    <div class="row">
      <div class="col"><br/></div>
    </div>
    <div class="row">
      <div class="col">{obj:img_alt_{iid}}</div>
    </div>
    <div class="row">
      <div class="col">{obj:img_des_{iid}}</div>
    </div>
    <div class="row">
      <div class="col">{obj:button-submit}</div>
    </div>
  </div>
  [dbx:js]
 </form>
</div>
