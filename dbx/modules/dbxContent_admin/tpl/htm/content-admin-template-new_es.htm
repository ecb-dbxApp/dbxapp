<section class="dbx-panel dbx-content-admin-template-new p-3">
 <header class="dbx-bar dbx-bar--module mb-3">
  <div class="dbx-bar-title">
   <i class="bi bi-file-earmark-plus"></i>
   <span class="dbx-bar-copy">
    <span class="dbx-bar-heading">Nueva plantilla de contenido</span>
    <span class="dbx-bar-subtitle">c)* Crear diseño con todas las áreas</span>
   </span>
  </div>
  <div class="dbx-bar-actions">{help_button}</div>
 </header>
 {obj:form_msg}
 <form action="{action}" method="post" class="dbxAjax">
  <div class="mb-3">
   {obj:template_name}
   <div class="form-text">Nombre de archivo sin terminar. será el siguiente: <code>c-name.htm</code> dentro <code>dbxContent/tpl/htm/</code> almacenado.</div>
  </div>
  <div class="d-flex gap-2">
   <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> Creación</button>
  </div>
 </form>
</section>
