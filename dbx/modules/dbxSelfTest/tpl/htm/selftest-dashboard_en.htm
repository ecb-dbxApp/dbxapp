<div class="dbx-panel dbxReport dbx-ajax-root dbx-selftest" id="dbx_target_{i}"
     data-dbx="lib=report|form=0"
     data-dbx-selftest
     data-start-url="{start_url}"
     data-execute-url="{execute_url}"
     data-finish-url="{finish_url}"
     data-browser-result-url="{browser_result_url}">
{report:message}
 [tpl=dbxSelfTest|selftest-dashboard-style]
 <form action="{action}" method="post" id="dbx_form_{i}" class="dbxAjax">
  {report:bar}
  <div class="dbx-selftest-summary-bar alert {summary_class} d-flex align-items-center justify-content-between flex-wrap gap-2"
       data-selftest-run-summary role="status">
   <span data-selftest-run-summary-text><i class="bi {summary_icon}" aria-hidden="true"></i> {summary_line}</span>
   {clear_history_button}
  </div>
  <div class="dbx-selftest-actions">
   <button type="button" class="btn btn-primary btn-sm" data-selftest-run="full"><i class="bi bi-play-circle"></i> Full test</button>
   <button type="button" class="btn btn-outline-primary btn-sm" data-selftest-run="quick"><i class="bi bi-lightning-charge"></i> Quick test</button>
   <button type="button" class="btn btn-outline-secondary btn-sm" data-selftest-run="selected"><i class="bi bi-check2-square"></i> Test selection</button>
   <button type="button" class="btn btn-outline-danger btn-sm btn-stop" data-selftest-stop hidden><i class="bi bi-stop-circle"></i> Stop run</button>
  </div>
  <div class="dbx-selftest-progress" data-selftest-progress hidden aria-live="polite">
   <div class="dbx-selftest-progress-head"><strong data-selftest-progress-title>Test run</strong><span data-selftest-progress-count>0 / 0</span></div>
   <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar progress-bar-striped progress-bar-animated" data-selftest-progress-bar style="width:0%"></div></div>
   <div class="small text-muted mt-2" data-selftest-current>Preparing …</div>
  </div>
  [dbx:pagination]
  <div class="table-responsive dbx-report-table-scroll">
   <table class="table table-striped table-bordered table-hover align-middle dbx-selftest-table">
    <thead>
     <tr class="{tr-class}">[rpt:row]</tr>
    </thead>
    <tbody>
     <hr class="dbx_split">
     <tr class="{tr-class}">[rpt:row]</tr>
     <hr class="dbx_split">
    </tbody>
   </table>
  </div>
  {report:footer}
 [dbx:js]
 </form>
 <script src="dbx/modules/dbxSelfTest/js/selftest.js?v={dbx:asset_version}-1" defer></script>
</div>
