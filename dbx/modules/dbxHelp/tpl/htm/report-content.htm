[tpl=dbx|report-panel-head]
 <form action="?dbx_modul=dbxHelp&dbx_run1=report_flat" method="post" id="dbx_form_{i}" class="dbxAjax">
  [inc=1]tpl=report-form-select&modul=dbx[/inc]
  [dbx:pagination]
  <table class="table table-striped table-bordered table-dark table-hover" data-toggle="table">
   <thead>
    <tr class="{tr-class}">[rpt:row]</tr>
   </thead>
   <tbody>
    <hr class="dbx_split">
    <tr class="{tr-class}">[rpt:row]</tr>
    <hr class="dbx_split">
   </tbody>
   <tfoot>
    <tr>
     <td colspan="{rpt:col_count}">{obj:rows_delete}</td>
    </tr>
   </tfoot>
  </table>
  [dbx:js]
 </form>
[tpl=dbx|report-panel-foot]
