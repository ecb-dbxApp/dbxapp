<div class="dbx-bar bar sticky dbx-editor-bar">
 <span>File:</span>
 <input class="editor-filename" type="text">
 <button class="editor-save" title="Save"><i class="bi bi-floppy"></i></button>
 <button class="editor-copy gap-2" title="Copying"><i class="bi bi-files"></i></button>
 <button class="editor-rename gap-1" title="Renamed"><i class="bi bi-pencil-square"></i></button>
 <button class="editor-delete gap-1" title="Delete"><i class="bi bi-trash"></i></button>
 <span class="editor-dirty gap-2"></span>
</div>
