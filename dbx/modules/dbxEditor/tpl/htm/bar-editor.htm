<div class="dbx-bar bar sticky dbx-bar--editor">
 <span>File:</span>
 <input class="editor-filename" type="text">
 <button class="editor-save" data-dbx-tooltip="Speichern"><i class="bi bi-floppy"></i></button>
 <button class="editor-copy gap-2" data-dbx-tooltip="Kopieren"><i class="bi bi-files"></i></button>
 <button class="editor-rename gap-1" data-dbx-tooltip="Umbenennen"><i class="bi bi-pencil-square"></i></button>
 <button class="editor-delete gap-1" data-dbx-tooltip="Loeschen"><i class="bi bi-trash"></i></button>
 <span class="editor-dirty gap-2"></span>
</div>
