[tpl=dbx|frame-head]
[tpl=dbx|frame-body-open]
<div class="alert alert-danger">
 <h2 class="h5"><i class="bi bi-exclamation-triangle"></i> Ticket #{rid} endgültig löschen?</h2>
 <p class="mb-0">Die Anfrage, alle Antworten, internen Notizen und Statusmeldungen werden dauerhaft entfernt.</p>
</div>
{obj:confirm_delete}
<div class="d-flex justify-content-end gap-2 mt-3">
 <a class="btn btn-outline-secondary" href="?dbx_modul=dbxContact_admin&amp;dbx_run1=ticket&amp;rid={rid}">Abbrechen</a>
 <button class="btn btn-danger" type="submit"><i class="bi bi-trash"></i> Endgültig löschen</button>
</div>
<div class="d-none">[dbx:form]</div>
[tpl=dbx|frame-body-close]
[tpl=dbx|frame-foot]
