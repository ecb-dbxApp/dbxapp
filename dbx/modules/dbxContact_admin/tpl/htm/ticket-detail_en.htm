<div class="p-3">
 <div class="row g-3">
  <div class="col-xl-4">
   <section class="card shadow-sm h-100">
    <div class="card-header d-flex justify-content-between align-items-center">
     <strong>Ticket #{rid}</strong>
     <span class="badge {status_class}">{status_label}</span>
    </div>
    <div class="card-body">
     <h2 class="h5">{subject}</h2>
     <dl class="row small mb-0">
      <dt class="col-4">Name</dt><dd class="col-8">{name}</dd>
      <dt class="col-4">E-mail</dt><dd class="col-8"><a href="mailto:{email_attr}">{email}</a></dd>
      <dt class="col-4">Telephone</dt><dd class="col-8">{phone}</dd>
      <dt class="col-4">Created</dt><dd class="col-8">{create_date}</dd>
      <dt class="col-4">Priority</dt><dd class="col-8"><span class="badge {priority_class}">{priority_label}</span></dd>
      <dt class="col-4">Users</dt><dd class="col-8">{uid}</dd>
      <dt class="col-4">Visibility</dt><dd class="col-8">{user_visibility}</dd>
     </dl>
    </div>
   </section>
  </div>
  <div class="col-xl-8">
   <section class="card shadow-sm">
    <div class="card-header"><strong>History</strong></div>
    <div class="card-body">{timeline}</div>
   </section>
  </div>
  <div class="col-12">{reply_form}</div>
 </div>
</div>
