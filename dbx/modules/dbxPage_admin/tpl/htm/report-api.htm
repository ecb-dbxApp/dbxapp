<div class="dbx-panel dbxReport" id="dbx_target_{i}"> 
 <form action="{action}" method="post" id="dbx_form_{i}" class="dbxAjax {class}"> 
 [dbx:form] 
 [tpl=dbx|report-form-select]
 [dbx:pagination] 
 <hr/> 
 <table class="table table-striped table-bordered table-light table-hover" data-toggle="table"> 
 <thead> 
    <tr class="{tr-class}">[rpt:row]</tr>
 </thead> 
 <tbody> 
 <hr class="dbx_split"> 
 <tr class="{tr-class}">[rpt:row]</tr>
 <hr class="dbx_split"> 
 </tbody> 
 <tfoot> 
 <tr> 
 <td colspan="{rpt:col_count}"> 
 <div class="row align-items-center"> 
 <div class="col">{obj:rows_select}</div> 
 <div class="col">{obj:rows_deselect}</div> 
 <div class="col">{obj:rows_delete}</div> 
 <div class="col">{obj:rows_activate}</div> 
 <div class="col">{obj:rows_deactivate}</div> 
 </div> 
 </td> 
 </tr> 
 </tfoot> 
 </table> 
 [dbx:js] 
 </form> 
</div>
