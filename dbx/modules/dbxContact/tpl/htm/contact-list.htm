<section class="dbx-panel dbx-contact dbxReport dbx-ajax-root" id="dbx_target_{i}" data-dbx="lib=report|form=0">
{report:message}
 <div class="dbx-panel-body">
  <form action="{action}" method="post" id="dbx_form_{i}" class="dbxAjax">
   {report:bar}
   [dbx:pagination]
   <div class="table-responsive dbx-report-table-scroll">
    <table class="table table-striped table-bordered table-hover align-middle">
     <thead><tr class="{tr-class}">[rpt:row]</tr></thead>
     <tbody>
      <hr class="dbx_split">
      <tr class="{tr-class}">[rpt:row]</tr>
      <hr class="dbx_split">
     </tbody>
    </table>
   </div>
   {report:footer}
 [dbx:js]
  </form>
 </div>
</section>
