[tpl=dbx|form-shell-head]
 <section class="dbx-form-group">
  <div class="dbx-form-group-head">
   <h5>Your contact details</h5>
  </div>
  <div class="row g-3">
   <div class="col-12 col-md-4">{obj:name}</div>
   <div class="col-12 col-md-4">{obj:email}</div>
   <div class="col-12 col-md-4">{obj:phone}</div>
  </div>
 </section>
 <section class="dbx-form-group">
  <div class="dbx-form-group-head">
   <h5>Your request</h5>
  </div>
  <div class="row g-3">
   <div class="col-12">{obj:subject}</div>
   <div class="col-12">{obj:message}</div>
  </div>
 </section>
[tpl=dbx|form-shell-foot]
