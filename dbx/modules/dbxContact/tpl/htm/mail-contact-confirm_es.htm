<div style="font-family:Segoe UI,Arial,sans-serif;line-height:1.55;color:#1e293b;max-width:640px;">
 <h2 style="margin:0 0 12px;font-size:1.35rem;color:#166534;">Su solicitud ha sido recibida</h2>
 <p style="margin:0 0 14px;">Hola. {name},</p>
 <p style="margin:0 0 14px;">
  Gracias por tu mensaje. Tenemos su solicitud de contacto bajo el número
  <strong>#{rid}</strong> Reciben y trabajarán.
 </p>
 <table cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse;margin:0 0 16px;">
  <tr>
   <td style="padding:6px 0;color:#64748b;width:110px;vertical-align:top;">Asunto</td>
   <td style="padding:6px 0;"><strong>{subject}</strong></td>
  </tr>
  <tr>
   <td style="padding:6px 0;color:#64748b;vertical-align:top;">Teléfono</td>
   <td style="padding:6px 0;">{phone}</td>
  </tr>
 </table>
 <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px 16px;margin:0 0 16px;">
  <div style="font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#64748b;margin:0 0 8px;">Tu mensaje</div>
  <div style="white-space:pre-wrap;">{message}</div>
 </div>
 <p style="margin:0;">Nos pondremos en contacto con usted lo antes posible. No tienes que hacer nada más.</p>
</div>
