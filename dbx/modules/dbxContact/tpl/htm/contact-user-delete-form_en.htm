[tpl=dbx|frame-head]
[tpl=dbx|frame-body-open]
<div class="alert alert-warning">
 <h2 class="h5">Remove ticket #{rid} from your view?</h2>
 <p class="mb-0">The ticket will be hidden from your view. Its complete history remains available to support.</p>
</div>
{obj:confirm_delete}
<div class="d-flex justify-content-end gap-2 mt-3">
 <a class="btn btn-outline-secondary" href="?dbx_modul=dbxContact&amp;dbx_run1=my&amp;dbx_run2=ticket&amp;rid={rid}">Cancel</a>
 <button class="btn btn-danger" type="submit"><i class="bi bi-trash"></i> Remove</button>
</div>
<div class="d-none">[dbx:form]</div>
[tpl=dbx|frame-body-close]
[tpl=dbx|frame-foot]
