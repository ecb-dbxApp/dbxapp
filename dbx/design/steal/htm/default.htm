<!DOCTYPE html>
<html lang="{dbx:lng}">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#22272b">

    <title>{dbx:document_title}</title>{dbx:head_meta}

    <!-- base href wird vom System automatisch ergänzt -->
    <!-- {dbx:base_href} -->

    <link rel="stylesheet" href="dbx/vendor/twbs/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="dbx/vendor/twbs/bootstrap-icons/font/bootstrap-icons.css">

    <link rel="stylesheet" href="dbx/design/steal/css/colors.css?v={dbx:asset_version}">
    <link rel="stylesheet" href="{dbx:skin_css}?v={dbx:asset_version}">
    <link rel="stylesheet" href="dbx/design/steal/css/base.css?v={dbx:asset_version}">
    <link rel="stylesheet" href="dbx/design/steal/css/theme.css?v={dbx:asset_version}">
    <link rel="stylesheet" href="dbx/design/steal/css/glass-3d.css?v={dbx:asset_version}">
    <link rel="stylesheet" href="dbx/design/steal/css/steal-metal.css?v={dbx:asset_version}">
    <link rel="stylesheet" href="dbx/design/steal/css/steal-riffel-chrome.css?v={dbx:asset_version}">
</head>

<body class="dbx-app dbx-header-sticky no-bg dbx-steal dbx-steal-riffel {dbx:skin_class}"[inc=is_dbx_edit()] data-dbx="lib=icons_editor"[/inc] data-dbx-skin="{dbx:color}" data-dbx-design="{dbx:design}">

<div id="dbxApp">
    <header id="dbxHeader">
        [inc=has_group('admin')]
        <nav id="dbx_admin_menu" class="dbx-menu dbx-menu-admin" data-dbx='lib=menu|id=admin|label=<i class="bi bi-shield-lock"></i> Admin' style="visibility:hidden">
            [modul=dbxMenu]dbx_run1=load&tpl=modul|dbx-top-admin[/modul]
        </nav>
        [/inc]
        <nav id="dbx_main_menu" class="dbx-menu dbx-menu-main" data-dbx='lib=menu|id=user|label=<i class="bi bi-person"></i> Benutzer' style="visibility:hidden">
            [modul=dbxMenu]dbx_run1=load&tpl=modul|dbx-top-main[/modul]
        </nav>
    </header>

    <main id="dbxMain">
        <div class="dbx-content">
            <div class="container-fluid py-3" id="dbxContent">
                [dbx:content]
            </div>
        </div>
    </main>

    <footer id="dbxFooter" class="dbx-app-footer">
        <div class="dbx-footer-dockbar" aria-label="Fensterleiste">
            <div id="windrop" class="dbx-window-dock" aria-label="Minimierte Fenster"></div>
            <button id="dbxWindowCloseAll" class="dbx-footer-window-close-all" type="button" data-dbx-tooltip="Alle Fenster schließen" aria-label="Alle Fenster schließen">
                <i class="bi bi-x-square"></i>
            </button>
        </div>

        <div class="dbx-footer-info" aria-label="Systeminformationen">
            <span class="dbx-footer-info-item" data-dbx-tooltip="Laufzeit bis die Seite geladen ist">
                <i class="bi bi-speedometer2"></i>
                <span>Laufzeit</span>
                <strong id="dbxScriptRuntime" data-dbx-runtime data-dbx-php-runtime="">...</strong>
            </span>
            <a href="datenschutz" class="dbx-footer-consent-link dbx-win" data-dbx="lib=openWin|url=datenschutz|title=Datenschutz|width=900|height=95%|position=center-top|reload=1|minimizable=1|maximizable=1">Datenschutz</a>
            <span class="dbx-footer-brand">© STEAL · dbXapp</span>
        </div>
    </footer>
</div>

<div id="dbxPreloader" class="dbx-preloader" style="display:none!important;pointer-events:none!important;background:transparent!important;box-shadow:none!important;"></div>

<button id="dbxBackToTop" class="btn btn-primary">
    <i class="bi bi-arrow-up"></i><br><br>
</button>

<script src="dbx/vendor/components/jquery/jquery.min.js"></script>
<script src="dbx/js/lib/core.js?design={dbx:design}&log=off&v={dbx:asset_version}"></script>
{dbx:module_assets}
</body>
</html>
