<!DOCTYPE html>
<html lang="de">
<head>
    <!-- =====================================================
         META
         ===================================================== -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{dbx:title}</title>{dbx:head_meta}

    <!-- base href wird vom System automatisch ergänzt -->
    <!-- {dbx:base_href} -->

    <!-- =====================================================
         VENDOR CSS (via Composer)
         ===================================================== -->
    <link rel="stylesheet" href="dbx/vendor/twbs/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="dbx/vendor/twbs/bootstrap-icons/font/bootstrap-icons.css">



    <!-- =====================================================
         DESIGN CSS – dbxapp
         ===================================================== -->
    <link rel="stylesheet" href="dbx/design/_admin/css/colors.css">
    <link rel="stylesheet" href="dbx/design/_admin/css/base.css">
    <link rel="stylesheet" href="dbx/design/_admin/css/form.css">
    <link rel="stylesheet" href="dbx/design/_admin/css/print.css">
    <link rel="stylesheet" href="dbx/design/_admin/css/layout.css">
    <link rel="stylesheet" href="dbx/design/_admin/css/menu.css">
    <link rel="stylesheet" href="dbx/design/_admin/css/theme.css">
    <link rel="stylesheet" href="dbx/design/_admin/css/menu-theme.css">
</head>
<body class="print-root">
    <h1>Editor</h1>
    [dbx:content]


<!-- =========================================================
     SYSTEM ELEMENTS
     ========================================================= -->


<!-- Global Preloader -->
<div id="dbxPreloader" class="dbx-preloader" style="display:none!important;pointer-events:none!important;background:transparent!important;box-shadow:none!important;"></div>

<!-- Back to top -->
<button id="dbxBackToTop" class="btn btn-primary">
    <i class="bi bi-arrow-up"></i>
</button>

<!-- =========================================================
     VENDOR JS (via Composer)
     ========================================================= -->
<script src="dbx/vendor/components/jquery/jquery.min.js"></script>
<script src="dbx/vendor/twbs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

<!-- =========================================================
     DESIGN JS – dbxapp
     ========================================================= -->

<script src="dbx/js/lib/core.js?v=90"></script>
<script>
(function () {
    function dbxDisablePreloader() {
        document.querySelectorAll("#dbxPreloader,.dbx-preloader").forEach(function (el) {
            el.classList.remove("active");
            el.style.setProperty("display", "none", "important");
            el.style.setProperty("pointer-events", "none", "important");
            el.style.setProperty("background", "transparent", "important");
            el.style.setProperty("box-shadow", "none", "important");
        });
        if (window.dbx && dbx.preloader) {
            dbx.preloader.show = function () { dbxDisablePreloader(); };
            dbx.preloader.hide = function () { dbxDisablePreloader(); };
        }
    }
    dbxDisablePreloader();
    document.addEventListener("DOMContentLoaded", dbxDisablePreloader);
    window.addEventListener("load", dbxDisablePreloader);
    window.setTimeout(dbxDisablePreloader, 250);
    window.setTimeout(dbxDisablePreloader, 1000);
})();
</script>

</body>
</html>
