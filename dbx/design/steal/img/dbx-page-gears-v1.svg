<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" aria-hidden="true">
  <defs>
    <g id="gear" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle r="76"/>
      <circle r="28"/>
      <rect x="-10" y="-110" width="20" height="38" rx="3"/>
      <rect x="-10" y="-110" width="20" height="38" rx="3" transform="rotate(30)"/>
      <rect x="-10" y="-110" width="20" height="38" rx="3" transform="rotate(60)"/>
      <rect x="-10" y="-110" width="20" height="38" rx="3" transform="rotate(90)"/>
      <rect x="-10" y="-110" width="20" height="38" rx="3" transform="rotate(120)"/>
      <rect x="-10" y="-110" width="20" height="38" rx="3" transform="rotate(150)"/>
      <rect x="-10" y="-110" width="20" height="38" rx="3" transform="rotate(180)"/>
      <rect x="-10" y="-110" width="20" height="38" rx="3" transform="rotate(210)"/>
      <rect x="-10" y="-110" width="20" height="38" rx="3" transform="rotate(240)"/>
      <rect x="-10" y="-110" width="20" height="38" rx="3" transform="rotate(270)"/>
      <rect x="-10" y="-110" width="20" height="38" rx="3" transform="rotate(300)"/>
      <rect x="-10" y="-110" width="20" height="38" rx="3" transform="rotate(330)"/>
      <circle r="57" stroke-dasharray="2 11" opacity=".54"/>
    </g>

    <g id="engraved-gear">
      <use href="#gear" stroke="#414b50" stroke-width="5" opacity=".24" transform="translate(2.5 3)"/>
      <use href="#gear" stroke="#ffffff" stroke-width="3" opacity=".58" transform="translate(-1.5 -1.5)"/>
      <use href="#gear" stroke="#77848a" stroke-width="2" opacity=".5"/>
    </g>
  </defs>

  <!-- Wenige große Gravuren statt einer wiederholten Hintergrundtextur. -->
  <g>
    <g transform="translate(120 260) rotate(-12) scale(.92)">
      <use href="#engraved-gear"/>
    </g>
    <g transform="translate(245 390) rotate(18) scale(.46)">
      <use href="#engraved-gear"/>
    </g>

    <g transform="translate(1490 690) rotate(10) scale(1.12)">
      <use href="#engraved-gear"/>
    </g>
    <g transform="translate(1340 545) rotate(-21) scale(.58)">
      <use href="#engraved-gear"/>
    </g>

    <g transform="translate(122 900) rotate(24) scale(.52)">
      <use href="#engraved-gear"/>
    </g>
  </g>
</svg>
