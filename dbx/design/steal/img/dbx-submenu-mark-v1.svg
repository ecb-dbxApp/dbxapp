      <circle r="12"/>
      <rect x="-6" y="-51" width="12" height="18" rx="2"/>
      <rect x="-6" y="-51" width="12" height="18" rx="2" transform="rotate(45)"/>
      <rect x="-6" y="-51" width="12" height="18" rx="2" transform="rotate(90)"/>
