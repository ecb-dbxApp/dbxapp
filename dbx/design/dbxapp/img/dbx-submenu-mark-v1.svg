<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" role="img" aria-label="Dezente technische Leiterbahnen">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.64" stop-color="#7dc4ff" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#238ee8" stop-opacity="0.11"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9e1ff" stop-opacity="0.28"/>
      <stop offset="0.58" stop-color="#70bdff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#2d91e5" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="420" height="640" fill="url(#fade)"/>

  <!-- Ruhige Leiterbahnen nur im freien rechten unteren Bereich. -->
  <g fill="none" stroke="#9bd2ff" stroke-width="1.2" stroke-linecap="square" opacity="0.13">
    <path d="M286 520h60l18-18h68"/>
    <path d="M316 555h50l17-17h49"/>
    <path d="M338 590h32l15-15h47"/>
    <rect x="282" y="516" width="8" height="8" rx="1"/>
    <rect x="312" y="551" width="8" height="8" rx="1"/>
    <rect x="334" y="586" width="8" height="8" rx="1"/>
  </g>

  <!-- Kantiger Technik-Abschluss: dunkle Fräskante, blaue Spur und Lichtkante. -->
  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <g stroke="#071b31" stroke-width="5" opacity="0.48" transform="translate(1.5 2)">
      <path d="M432 557h-38l-25 25h-24"/>
      <path d="M432 596h-22l-19 19h-20"/>
    </g>
    <g stroke="url(#trace)">
      <path d="M432 557h-38l-25 25h-24" stroke-width="3.2"/>
      <path d="M432 596h-22l-19 19h-20" stroke-width="2.6"/>
    </g>
    <g stroke="#e8f6ff" opacity="0.58" transform="translate(-0.4 -0.7)">
      <path d="M432 557h-38l-25 25h-24" stroke-width="0.9"/>
      <path d="M432 596h-22l-19 19h-20" stroke-width="0.75"/>
    </g>
  </g>

  <g fill="#80c8ff" stroke="#dff2ff" stroke-width="0.8" opacity="0.76">
    <rect x="340" y="577" width="10" height="10" rx="1"/>
    <rect x="366" y="610" width="10" height="10" rx="1"/>
    <rect x="389" y="552" width="9" height="9" transform="rotate(45 393.5 556.5)"/>
    <rect x="406" y="591" width="8" height="8" transform="rotate(45 410 595)"/>
  </g>
</svg>
