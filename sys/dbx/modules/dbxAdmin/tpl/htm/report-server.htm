<div class="container dbxReport dbxForm_wrapper" id="dbx_target_{i}" style>          
    <div class="row">           
        <div class="col">{obj:new_server}<br/><br/></div>       
    </div>            
    <form action="{action}" class="dbxAjax" method="post" id="dbx_form_{i}" data-dbx_target="dbx_target_{i}">           
        <div class="table-responsive">            
            <table class="table table-striped table-bordered table-hover">                
                <thead class="thead-light">                    
                    <tr>[dbx:row]</tr>                   
                </thead>                   
                <tbody>                       
                    <hr class="dbx_split">                       
                    <tr class='{even-odd}'>[dbx:row]</tr>                       
                    <hr class="dbx_split">                   
                </tbody>                   
                <tfooter>                       
                    <tr>                           
                        <td colspan="{col_count}">                               
                            <div class="row align-items-center">                                   
                                <div class="col">{obj:maction_select}</div>                                   
                                <div class="col">{obj:maction_submit}</div>                               
                            </div>                           
                        </td>                       
                    </tr>                   
                </tfooter>               
            </table>           
        </div>         
    </form>    
   [dbx:js] 
   {obj:modal1}         
</div>
