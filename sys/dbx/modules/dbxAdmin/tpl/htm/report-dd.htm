<div class="container dbxReport" id="dbx_target_{i}"> 
    <h3>Fields</h3> 
    <form action="{action}" class="dbxAjax" method="post" id="dbx_form_{i}" data-dbx_target="dbx_target_{i}"> 
        <div class="table-responsive">
        
            {obj:add_rec}       
            [dbx:form]       
            [inc=1]tpl=report-form-select&modul=dbx[/inc]
            {obj:sql}  
            <hr/><br/>        
        
            <table class="table table-striped table-bordered">
                <thead class="thead-light">
                    <tr>[dbx:row]</tr> 
                </thead> 
                <tbody> 
                    <hr class="dbx_split"> 
                    <tr class='{even-odd}'>[dbx:row]</tr> 
                    <hr class="dbx_split"> 
                </tbody> 
                <tfoot> 
                    <tr> 
                        <td colspan="{col_count}">{obj:add_fld}</td>
                    </tr> 
                </tfoot> 
            </table> 
        </div> 
        <div class="row align-items-center">              
            <div class="col">{obj:maction_select}</div>              
            <div class="col">{obj:maction_submit}</div>              
        </div>        
        [dbx:js] 
    </form> 
    {obj:modal1}  
</div>
