<div class="dbxForm_wrapper w100" id="dbx_target_{i}">

        <div class="row">
            <div class="col">{obj:form_msg}</div>
        </div>
        <div class="row">
            <div class="col-5">{obj:list_pat}</div><div class="col-2"><br></div><div class="col-5">{obj:edit_pat}</div>
        </div>
        <div class="row">
            <div class="col">[dbx:form]<hr/></div>
        </div>       
        <div class="table anforderung-tab">
            <div class="row">
                 <div class="col-9"> {obj:anforderungen}</div>
                 <div class="col-3"> {obj:profile}</div>
            </div> 
        </div>
        [dbx:js]
    </form>
</div>
