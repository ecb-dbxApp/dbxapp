
<div Id="dbxForm_div-{i}" class="dbxForm_wrapper">
  <form action="?dbx_modul=dbxUser&dbx_action=login" method="post" id="form_login">
    <div class="form_msg {msg_class}">
         {obj:form_msg}
    </div>
    [dbx:form]
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <div class="checkbox">
          <label>
            <input type="checkbox" name="check" id="check"> Anmeldung speichern
          </label>
        </div>
      </div>
    </div>

    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <input type="submit"  Value="Login / Anmelden" class="btn btn-primary"></button>
      </div>
    </div>
  </form>
</div>
