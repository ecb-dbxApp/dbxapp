<div class="dbx_pagination">
  <nav aria-label="Pagination">
    <ul class="pagination">
      <li class="page-item">
        <a class="page-link dbxAjax" href="{href_first}" aria-label="First">
          <span aria-hidden="true">|&laquo;</span>
        </a>
      </li>
      <li class="page-item">
        <a class="page-link dbxAjax" href="{href_prev}" aria-label="Prev">
          <span aria-hidden="true">&lt;</span>
        </a>
      </li>
      <hr class="dbx_split">
      <li class="page-item {active}" {current}><a class="page-link dbxAjax" {p_active} href="{href_page}">{p}</a></li>
      <hr class="dbx_split">
      <li class="page-item">
        <a class="page-link dbxAjax" href="{href_next}" aria-label="Next">
          <span aria-hidden="true">&gt;</span>
        </a>
      </li>
      <li class="page-item">
        <a class="page-link dbxAjax" href="{href_last}" aria-label="Last">
          <span aria-hidden="true">&raquo;|</span>
        </a>
      </li>
    </ul>
  </nav>
</div>
