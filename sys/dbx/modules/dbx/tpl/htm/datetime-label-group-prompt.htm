<div class="form-group">
  <label for="d{name}" {tooltip} class="col-sm-2 control-label">{label}:</label>
  <div class="col-sm-10">
     <div class="input-group">
        <input type="date"  class="form-control {class}" id="d_{name}_{i}" name="d_{name}" placeholder="TT.MM.JJJJ" value="d_{value}"  {required}>
         &nbsp;&nbsp;
        <input type="time"  class="form-control {class}" id="t_{name}_{i}" name="t_{name}" placeholder="HH:MM" value="t_{value}"  {required}>
    </div>
    {msg:{name}}
  </div>
</div>
