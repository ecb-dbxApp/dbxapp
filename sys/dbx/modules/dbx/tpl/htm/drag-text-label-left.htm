 <div class="resizable-container {drag}"  style="position: absolute; top: {obj-x}; left: {obj-y}; width: {obj-w}; height: {obj-h}; {style}">
    <label for="{name}_{i}" {tooltip} >{label}:</label>
    <div class="input-container">
        <input type="text" class="form-control {class}" id="{name}_{i}" name="{name}" placeholder="{placeholder}" data-bs-toggle="tooltip" data-bs-placement="top" title="{tooltip}" value="{value}" {required}>
    </div>
</div>
