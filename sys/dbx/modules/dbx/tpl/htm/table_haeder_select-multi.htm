<th class="{th-class}"> 
 <div class="form-check form-check-inline"> 
 <input class="form-check-input" type="checkbox" id="selectall" name="{name}" value="-selected-" {checked} data-dbx_form="#dbx_form_{i}" data-dbx_target="#dbx_target_{i}" > 
 <label class="form-check-label" for="cb_{i}">{name} (<span id="cb_count_{i}" class="cb_count_select no-sort">{count_sel}</span>)</label> 
 </div> 
</th>
