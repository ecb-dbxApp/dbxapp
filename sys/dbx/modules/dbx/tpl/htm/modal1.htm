<!-- Modal -->
<div class="modal fade" id="dbxModal1" tabindex="-1" aria-labelledby="ModalLabel1" aria-hidden="true">
  <div class="modal-dialog {class}">
    <div class="modal-content">
      <div class="container-fluid">
        <div class="modal-header">
          <h5 class="modal-title" id="ModalLabel1">{title}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body modal-dialog-scrollable" id="modal1_body">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
        <div class="modal-footer">
          <hr/>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
$("#dbxModal1").on("hide.bs.modal", function () {
 {on_close}
});
</script>
