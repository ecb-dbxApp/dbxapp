<div class="container dbxReport dbxForm_wrapper" id="dbx_target_{i}" >  
 <div class="row"> 
    <div class="col">{obj:add_arzt}</div> 
 </div>    
 <form action="{action}" class="dbxAjax dbxForm" method="post" id="dbx_form_{i}" data-dbx_target="dbx_target_{i}">  
 [inc=1]tpl=report-form-select&modul=dbx[/inc]  
 [dbx:pagination]  
 <hr/>  
 <table id="dbx_table_{i}" class="bootstrap-table bootstrap5 table table-striped table-bordered table-light table-hover data-table"  
 data-toggle="-table"  
 data-search="true"  
 data-show-columns="true"  
 data-show-export="true"  
 data-id-field="id"  
 data-multiple-select-row="true"  
 data-multipleSelectRow="true"  
 data-click-to-select="true"  
 data-pagination="true"  
 >  
 <thead>  
 <tr>  
 [dbx:row]  
 </tr>  
 </thead>  
 <tbody>  
 <hr class="dbx_split">  
 <tr class='{even-odd}'>  
 [dbx:row]  
 </tr>  
 </tbody>
 <hr class="dbx_split">  
 <tfoot>  
 <tr>  
 <td colspan="{col_count}"><hr/></td>  
 </tr>  
 </tfoot>    
 </table>  
 </form>  
 [dbx:js]  
 {obj:modal1}  
</div>
