<div Id="dbxForm_div-{i}" class="dbxForm_wrapper">
  <form action="?dbx_modul=dbxLogin&dbx_action=login" method="post" id="form_login">
   
    <div class="container">
      <div class="row align-items-center">
         <div class="col-sm-12">{obj:form_msg}</div>
      </div>
      <div class="row hidden">
         <div class="col-sm-12">[dbx:form]</div>
      </div>      
      <div class="row align-items-center">
         <div class="col-sm-12">{obj:username}</div>
      </div>
      <div class="row align-items-center">
         <div class="col-sm-12">{obj:password}</div>
      </div>
      <div class="row align-items-center">
         <div class="col-sm-12"><input type="submit"  Value="Login / Anmelden" class="btn btn-primary w-100"></div>
      </div>
    </div>
    [dbx:js]
  </form>
</div>
